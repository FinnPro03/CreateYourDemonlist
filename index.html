<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CreateYourDemonlist</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0d0d0f;
            color: white;
        }

        header {
            background: #151518;
            border-bottom: 1px solid #29292e;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #ff3b3b;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 10px 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: #e53935;
        }

        button:hover {
            background: #ff4b47;
        }

        .secondary {
            background: #29292e;
        }

        .secondary:hover {
            background: #38383e;
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 30px 20px;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            font-size: 34px;
        }

        .subtitle {
            color: #999;
            margin-top: 7px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input {
            background: #19191d;
            border: 1px solid #333339;
            color: white;
            border-radius: 7px;
            padding: 11px 13px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #e53935;
        }

        #search {
            width: 250px;
        }

        .levels {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .level {
            background: #17171a;
            border: 1px solid #29292e;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .rank {
            width: 45px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #aaa;
        }

        .level-info {
            flex: 1;
            min-width: 0;
        }

        .level-name {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .level-details {
            color: #888;
            font-size: 14px;
        }

        .points {
            font-size: 17px;
            font-weight: bold;
            min-width: 90px;
            text-align: right;
        }

        .actions {
            display: flex;
            gap: 7px;
        }

        .edit {
            background: #3b3b42;
        }

        .delete {
            background: #8e2929;
        }

        .empty {
            text-align: center;
            padding: 70px 20px;
            color: #777;
            border: 1px dashed #333;
            border-radius: 10px;
        }

        /* Modal */

        .modal-background {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal {
            width: 100%;
            max-width: 500px;
            background: #18181c;
            border: 1px solid #303037;
            border-radius: 12px;
            padding: 25px;
        }

        .modal h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: #aaa;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        @media (max-width: 650px) {
            .level {
                flex-wrap: wrap;
            }

            .rank {
                width: 35px;
            }

            .points {
                min-width: auto;
            }

            .actions {
                width: 100%;
            }

            .actions button {
                flex: 1;
            }

            #search {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        Create<span>Your</span>Demonlist
    </div>

    <button onclick="saveList()">💾 Save List</button>
</header>

<main>

    <div class="top-section">

        <div>
            <h1 id="listTitle">My Demonlist</h1>
            <div class="subtitle">
                Create your own Geometry Dash Demonlist.
            </div>
        </div>

        <div class="controls">
            <input
                id="search"
                type="text"
                placeholder="🔎 Search levels..."
                oninput="renderLevels()"
            >

            <button onclick="openAddModal()">
                + Add Level
            </button>
        </div>

    </div>

    <div id="levels" class="levels"></div>

</main>


<!-- ADD / EDIT MODAL -->

<div id="modalBackground" class="modal-background">

    <div class="modal">

        <h2 id="modalTitle">Add Level</h2>

        <div class="form-group">
            <label>Level Name</label>
            <input id="levelName" placeholder="Amethyst">
        </div>

        <div class="form-group">
            <label>Creator</label>
            <input id="levelCreator" placeholder="iIPhantom">
        </div>

        <div class="form-group">
            <label>Geometry Dash Level ID</label>
            <input id="levelID" placeholder="12345678">
        </div>

        <div class="form-group">
            <label>Points</label>
            <input id="levelPoints" type="number" step="0.01" placeholder="350">
        </div>

        <div class="modal-buttons">

            <button
                class="secondary"
                onclick="closeModal()"
            >
                Cancel
            </button>

            <button onclick="saveLevel()">
                Save Level
            </button>

        </div>

    </div>

</div>


<script>

    let levels = JSON.parse(
        localStorage.getItem("createYourDemonlist")
    ) || [];

    let editingIndex = -1;


    function renderLevels() {

        const container = document.getElementById("levels");

        const search = document
            .getElementById("search")
            .value
            .toLowerCase();

        let visibleLevels = levels.filter(level =>
            level.name.toLowerCase().includes(search) ||
            level.creator.toLowerCase().includes(search)
        );

        if (visibleLevels.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    <h2>No levels here yet.</h2>
                    <p>Add your first level to start building your Demonlist.</p>
                </div>
            `;

            return;
        }

        container.innerHTML = "";

        visibleLevels.forEach(level => {

            const realIndex = levels.indexOf(level);

            const element = document.createElement("div");

            element.className = "level";

            element.innerHTML = `
                <div class="rank">
                    #${realIndex + 1}
                </div>

                <div class="level-info">

                    <div class="level-name">
                        ${escapeHTML(level.name)}
                    </div>

                    <div class="level-details">
                        ${escapeHTML(level.creator)}
                        ${level.id ? " • ID: " + escapeHTML(level.id) : ""}
                    </div>

                </div>

                <div class="points">
                    ${Number(level.points || 0).toFixed(2)}
                </div>

                <div class="actions">

                    <button
                        class="edit"
                        onclick="editLevel(${realIndex})"
                    >
                        Edit
                    </button>

                    <button
                        class="delete"
                        onclick="deleteLevel(${realIndex})"
                    >
                        Delete
                    </button>

                </div>
            `;

            container.appendChild(element);

        });
    }


    function openAddModal() {

        editingIndex = -1;

        document.getElementById("modalTitle").textContent =
            "Add Level";

        clearForm();

        document.getElementById("modalBackground").style.display =
            "flex";
    }


    function closeModal() {

        document.getElementById("modalBackground").style.display =
            "none";

        clearForm();
    }


    function clearForm() {

        document.getElementById("levelName").value = "";
        document.getElementById("levelCreator").value = "";
        document.getElementById("levelID").value = "";
        document.getElementById("levelPoints").value = "";

    }


    function saveLevel() {

        const name =
            document.getElementById("levelName").value.trim();

        const creator =
            document.getElementById("levelCreator").value.trim();

        const id =
            document.getElementById("levelID").value.trim();

        const points =
            Number(document.getElementById("levelPoints").value);


        if (!name) {

            alert("Please enter a level name.");

            return;
        }


        const level = {
            name: name,
            creator: creator || "Unknown",
            id: id,
            points: isNaN(points) ? 0 : points
        };


        if (editingIndex === -1) {

            levels.push(level);

        } else {

            levels[editingIndex] = level;

        }


        sortLevels();

        localStorage.setItem(
            "createYourDemonlist",
            JSON.stringify(levels)
        );

        closeModal();

        renderLevels();
    }


    function editLevel(index) {

        editingIndex = index;

        const level = levels[index];

        document.getElementById("modalTitle").textContent =
            "Edit Level";

        document.getElementById("levelName").value =
            level.name;

        document.getElementById("levelCreator").value =
            level.creator;

        document.getElementById("levelID").value =
            level.id;

        document.getElementById("levelPoints").value =
            level.points;

        document.getElementById("modalBackground").style.display =
            "flex";
    }


    function deleteLevel(index) {

        const level = levels[index];

        if (
            confirm(
                `Delete "${level.name}" from your Demonlist?`
            )
        ) {

            levels.splice(index, 1);

            localStorage.setItem(
                "createYourDemonlist",
                JSON.stringify(levels)
            );

            renderLevels();
        }
    }


    function sortLevels() {

        levels.sort(
            (a, b) =>
                Number(b.points) - Number(a.points)
        );
    }


    function saveList() {

        localStorage.setItem(
            "createYourDemonlist",
            JSON.stringify(levels)
        );

        alert("List saved! 🔥");
    }


    function escapeHTML(text) {

        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }


    renderLevels();

</script>

</body>
</html>
