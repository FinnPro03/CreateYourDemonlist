<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CreateYourDemonlist</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#080a0f;
  --panel:#10131b;
  --panel2:#151923;
  --panel3:#1b202c;
  --border:#292f3d;
  --text:#f4f6fb;
  --muted:#9199aa;
  --accent:#ff334f;
  --accent2:#ff5269;
  --green:#36d98a;
  --yellow:#ffd34d;
  --danger:#ff475f;
  --shadow:0 15px 45px rgba(0,0,0,.35)
}
body{
  margin:0;
  background:radial-gradient(circle at top,#151a27 0,#080a0f 42%);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh
}
button,input{font:inherit}
button{cursor:pointer}
.topbar{
  height:68px;
  border-bottom:1px solid var(--border);
  background:rgba(8,10,15,.88);
  backdrop-filter:blur(14px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:50
}
.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:-.5px
}
.logo span{color:var(--accent)}
.top-actions{display:flex;gap:8px;align-items:center}
.button{
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  padding:9px 13px;
  border-radius:9px;
  font-weight:700;
  transition:.15s
}
.button:hover{background:var(--panel3);border-color:#3a4253}
.button.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff
}
.button.primary:hover{background:var(--accent2)}
.button.danger{color:#ff6879}
.button.green{color:var(--green)}
.button.small{padding:7px 10px;font-size:13px}
.app{
  display:grid;
  grid-template-columns:250px 1fr;
  min-height:calc(100vh - 68px)
}
.sidebar{
  border-right:1px solid var(--border);
  background:rgba(13,16,23,.8);
  padding:18px 13px;
  position:sticky;
  top:68px;
  height:calc(100vh - 68px);
  overflow:auto
}
.side-title{
  color:var(--muted);
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1px;
  padding:0 9px 9px
}
.list-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
  width:100%;
  border:1px solid transparent;
  background:transparent;
  color:var(--text);
  padding:10px 9px;
  border-radius:8px;
  text-align:left;
  margin-bottom:4px
}
.list-item:hover{background:var(--panel2)}
.list-item.active{
  background:rgba(255,51,79,.12);
  border-color:rgba(255,51,79,.35)
}
.list-name{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis
}
.list-count{
  color:var(--muted);
  font-size:12px;
  flex-shrink:0
}
.main{
  width:100%;
  max-width:1150px;
  margin:auto;
  padding:28px
}
.hero{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  margin-bottom:25px
}
.hero h1{
  margin:0 0 7px;
  font-size:32px;
  letter-spacing:-1px
}
.hero p{margin:0;color:var(--muted)}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:22px
}
.stat{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  padding:17px
}
.stat-value{font-size:25px;font-weight:900}
.stat-label{color:var(--muted);font-size:12px;margin-top:3px}
.panel{
  background:rgba(16,19,27,.92);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  overflow:hidden
}
.panel-head{
  padding:16px 18px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px
}
.panel-title{font-size:16px;font-weight:900}
.panel-body{padding:18px}
.search-row{
  display:flex;
  gap:8px;
  margin-bottom:14px
}
.input{
  width:100%;
  background:#0b0e14;
  border:1px solid var(--border);
  color:var(--text);
  padding:11px 12px;
  border-radius:9px;
  outline:none
}
.input:focus{border-color:var(--accent)}
select.input{appearance:auto}
.results{display:grid;gap:8px}
.result{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  border:1px solid var(--border);
  background:var(--panel2);
  border-radius:10px;
  padding:12px
}
.result-info{min-width:0}
.result-name{
  font-weight:850;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis
}
.result-meta{font-size:12px;color:var(--muted);margin-top:3px}
.result-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.badge{
  border:1px solid var(--border);
  background:#0b0e14;
  border-radius:999px;
  padding:4px 8px;
  color:var(--muted);
  font-size:10px;
  font-weight:900
}
.badge.video{color:var(--green);border-color:rgba(54,217,138,.3)}
.empty{
  text-align:center;
  color:var(--muted);
  padding:45px 20px
}
.levels{display:grid;gap:12px}
.level-card{
  display:grid;
  grid-template-columns:68px 150px 1fr auto;
  gap:14px;
  align-items:center;
  border:1px solid var(--border);
  background:linear-gradient(135deg,#121620,#0e1118);
  border-radius:13px;
  padding:11px;
  min-width:0
}
.rank{
  font-size:25px;
  font-weight:950;
  text-align:center
}
.thumb{
  width:150px;
  height:84px;
  border-radius:8px;
  object-fit:cover;
  background:#080a0f;
  border:1px solid var(--border)
}
.level-info{min-width:0}
.level-name{
  font-size:17px;
  font-weight:900;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}
.level-meta{
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
  margin-top:3px
}
.level-meta b{color:#c9ced9}
.level-actions{
  display:flex;
  align-items:center;
  gap:5px
}
.small-button{
  width:31px;
  height:31px;
  padding:0;
  border-radius:7px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  font-weight:900
}
.small-button:hover{background:var(--panel3);border-color:#41495a}
.small-button.danger{color:#ff6174}
.notice{
  border:1px solid rgba(255,211,77,.25);
  background:rgba(255,211,77,.06);
  color:#e9d995;
  border-radius:10px;
  padding:11px 13px;
  font-size:13px;
  margin-bottom:14px
}
.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(5px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:18px
}
.modal-bg.show{display:flex}
.modal{
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto;
  background:#11151e;
  border:1px solid var(--border);
  border-radius:15px;
  box-shadow:0 25px 80px rgba(0,0,0,.55)
}
.modal-head{
  padding:16px 18px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center
}
.modal-head h2{margin:0;font-size:18px}
.modal-body{padding:18px}
.field{margin-bottom:13px}
.field label{
  display:block;
  color:#b8bfcc;
  font-size:12px;
  font-weight:800;
  margin-bottom:6px
}
.field small{display:block;color:var(--muted);margin-top:5px;font-size:11px}
.modal-foot{
  padding:14px 18px;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:flex-end;
  gap:8px
}
.close{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:22px
}
.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#171c27;
  border:1px solid var(--border);
  padding:12px 15px;
  border-radius:10px;
  box-shadow:var(--shadow);
  z-index:200;
  transform:translateY(20px);
  opacity:0;
  pointer-events:none;
  transition:.2s
}
.toast.show{transform:none;opacity:1}
.setup{
  position:fixed;
  inset:0;
  z-index:300;
  background:#080a0f;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px
}
.setup.show{display:flex}
.setup-box{
  width:min(480px,100%);
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:28px;
  box-shadow:var(--shadow)
}
.setup-box h1{margin:0 0 8px}
.setup-box p{color:var(--muted);line-height:1.6}
.public-mode .sidebar{display:none}
.public-mode .app{display:block}
.public-mode .main{max-width:1100px}
.public-banner{
  background:rgba(54,217,138,.08);
  border:1px solid rgba(54,217,138,.25);
  color:#b5f2d4;
  padding:11px 14px;
  border-radius:10px;
  margin-bottom:16px;
  font-size:13px
}
.source-line{color:var(--muted);font-size:11px;margin-top:2px}
.hidden{display:none!important}
@media(max-width:850px){
  .app{grid-template-columns:1fr}
  .sidebar{
    position:relative;
    top:0;
    height:auto;
    border-right:0;
    border-bottom:1px solid var(--border);
    max-height:190px
  }
  .main{padding:18px}
  .hero{flex-direction:column}
  .stats{grid-template-columns:1fr 1fr}
  .level-card{
    grid-template-columns:48px 100px 1fr;
  }
  .thumb{width:100px;height:60px}
  .level-actions{grid-column:1/-1;justify-content:flex-end}
}
@media(max-width:560px){
  .topbar{padding:0 13px}
  .logo{font-size:17px}
  .top-actions .button{padding:7px 9px}
  .main{padding:12px}
  .hero h1{font-size:26px}
  .stats{grid-template-columns:1fr}
  .search-row{flex-direction:column}
  .result{align-items:flex-start;flex-direction:column}
  .result-right{width:100%;justify-content:space-between}
  .level-card{
    grid-template-columns:42px 90px 1fr;
    gap:8px
  }
  .thumb{width:90px;height:55px}
  .level-name{font-size:14px}
  .level-meta{font-size:11px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">Create<span>Your</span>Demonlist</div>
  <div class="top-actions">
    <button class="button small" onclick="openProfile()">Profile</button>
    <button class="button small" onclick="openImport()">Import</button>
    <button class="button small" onclick="exportData()">Export</button>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="side-title">My Demonlists</div>
    <div id="listSidebar"></div>
    <button class="button primary" style="width:100%;margin-top:9px" onclick="openCreateList()">+ New Demonlist</button>
  </aside>

  <main class="main" id="main">
    <div id="publicBanner" class="public-banner hidden"></div>

    <section class="hero">
      <div>
        <h1 id="pageTitle">My Demonlist</h1>
        <p id="pageSubtitle">Build your own ranking of Geometry Dash demons.</p>
      </div>
      <div class="hero-actions" id="heroActions">
        <button class="button" onclick="openRenameList()">Rename</button>
        <button class="button primary" onclick="openAddLevel()">+ Add Level</button>
        <button class="button green" onclick="shareCurrentList()">Share Public Link</button>
      </div>
    </section>

    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="statLevels">0</div>
        <div class="stat-label">Levels</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="statRanked">0</div>
        <div class="stat-label">Ranked</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="statUpdated">Never</div>
        <div class="stat-label">Last updated</div>
      </div>
    </div>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">Demonlist</div>
        <div id="listUpdated" class="source-line"></div>
      </div>
      <div class="panel-body">
        <div id="levels" class="levels"></div>
      </div>
    </section>
  </main>
</div>

<div id="setup" class="setup">
  <div class="setup-box">
    <h1>CreateYourDemonlist</h1>
    <p>
      Choose a username for your local profile. No account is created and
      nothing is uploaded automatically.
    </p>
    <div class="field">
      <label>Username</label>
      <input id="setupUsername" class="input" maxlength="30" placeholder="FinnPro_03">
    </div>
    <button class="button primary" style="width:100%" onclick="finishSetup()">Create Profile</button>
  </div>
</div>

<div id="modalBg" class="modal-bg" onclick="modalOutside(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h2 id="modalTitle">Modal</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const STORAGE_KEY="createYourDemonlist_v2";
const POINTERCRATE="https://pointercrate.com/api/v2/demons/";
const AREDL="https://api.aredl.net/v2/api/aredl/levels";

let state=loadState();
let currentSearch=[];
let modalAction=null;
let publicList=null;

function $(id){return document.getElementById(id)}

function uid(){
  return Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,9);
}

function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return {username:"",lists:[],selectedListId:""};
    const s=JSON.parse(raw);
    if(!s||typeof s!=="object")throw 0;
    s.username=typeof s.username==="string"?s.username:"";
    s.lists=Array.isArray(s.lists)?s.lists:[];
    s.lists.forEach(l=>{
      if(!l.id)l.id=uid();
      if(!Array.isArray(l.levels))l.levels=[];
      l.levels.forEach(x=>{
        if(!x.id)x.id=uid();
        delete x.gdId;
        delete x.levelId;
      });
    });
    if(!s.selectedListId&&s.lists[0])s.selectedListId=s.lists[0].id;
    return s;
  }catch(e){
    return {username:"",lists:[],selectedListId:""};
  }
}

function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}

function escapeHtml(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttribute(v){
  return escapeHtml(v);
}

function showToast(message){
  const t=$("toast");
  t.textContent=message;
  t.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>t.classList.remove("show"),2400);
}

function getSelectedList(){
  return state.lists.find(x=>x.id===state.selectedListId)||null;
}

function ensureList(){
  if(!state.lists.length){
    const l={
      id:uid(),
      name:"My Demonlist",
      levels:[],
      createdAt:Date.now(),
      updatedAt:Date.now()
    };
    state.lists.push(l);
    state.selectedListId=l.id;
    save();
  }
}

function init(){
  if(location.hash.startsWith("#public=")){
    loadPublicFromHash();
    return;
  }

  ensureList();

  if(!state.username){
    $("setup").classList.add("show");
  }

  render();
}

function finishSetup(){
  const name=$("setupUsername").value.trim();
  if(!name){
    showToast("Please enter a username.");
    return;
  }
  state.username=name.slice(0,30);
  save();
  $("setup").classList.remove("show");
  render();
  showToast("Profile created!");
}

function render(){
  if(publicList){
    renderPublic();
    return;
  }

  const list=getSelectedList();
  if(!list)return;

  renderSidebar();

  $("pageTitle").textContent=list.name;
  $("pageSubtitle").textContent="Created by "+state.username;
  $("statLevels").textContent=list.levels.length;
  $("statRanked").textContent=list.levels.length;
  $("statUpdated").textContent=list.updatedAt?timeAgo(list.updatedAt):"Never";
  $("listUpdated").textContent=list.updatedAt?"Updated "+timeAgo(list.updatedAt):"";

  $("heroActions").innerHTML=`
    <button class="button" onclick="openRenameList()">Rename</button>
    <button class="button primary" onclick="openAddLevel()">+ Add Level</button>
    <button class="button green" onclick="shareCurrentList()">Share Public Link</button>
  `;

  renderLevels();
}

function renderSidebar(){
  $("listSidebar").innerHTML=state.lists.map(l=>`
    <button class="list-item ${l.id===state.selectedListId?"active":""}"
      onclick="selectList('${escapeAttribute(l.id)}')">
      <span class="list-name">${escapeHtml(l.name)}</span>
      <span class="list-count">${l.levels.length}</span>
    </button>
  `).join("");
}

function renderLevels(){
  const list=getSelectedList();
  if(!list)return;

  if(!list.levels.length){
    $("levels").innerHTML=`
      <div class="empty">
        <div style="font-size:36px;margin-bottom:10px">🏆</div>
        <div style="font-size:17px;font-weight:800;color:#dce1ea">Your Demonlist is empty</div>
        <div style="margin-top:6px">Add a real level from Pointercrate, AREDL, or create a custom level.</div>
        <button class="button primary" style="margin-top:16px" onclick="openAddLevel()">+ Add Your First Level</button>
      </div>`;
    return;
  }

  $("levels").innerHTML=list.levels.map((level,i)=>renderLevelCard(level,i)).join("");
}

function renderLevelCard(level,index,readonly=false){
  const thumb=level.thumbnail||placeholderThumbnail();
  const creator=level.creator||"Unknown creator";
  const verifier=level.verifier||"Not specified";
  const verified=level.verifiedDate?timeAgoDate(level.verifiedDate):"Not specified";
  const source=level.source||"Custom";
  const video=level.videoUrl
    ? `<a class="button small" href="${escapeAttribute(level.videoUrl)}" target="_blank" rel="noopener">▶ Video</a>`
    : "";

  const actions=readonly?`
    ${video}
  `:`
    <button class="small-button" title="Move up" onclick="moveLevel('${escapeAttribute(level.id)}',-1)">↑</button>
    <button class="small-button" title="Move down" onclick="moveLevel('${escapeAttribute(level.id)}',1)">↓</button>
    <button class="small-button" title="Set spot" onclick="setLevelSpot('${escapeAttribute(level.id)}')">#</button>
    <button class="small-button" title="Edit" onclick="openEditLevel('${escapeAttribute(level.id)}')">✏</button>
    <button class="small-button danger" title="Delete" onclick="deleteLevel('${escapeAttribute(level.id)}')">×</button>
  `;

  return `
    <article class="level-card">
      <div class="rank">#${index+1}</div>
      <img class="thumb" src="${escapeAttribute(thumb)}"
        onerror="this.src='${placeholderThumbnail()}'">
      <div class="level-info">
        <div class="level-name">${escapeHtml(level.name)}</div>
        <div class="level-meta">
          <div><b>Creator:</b> ${escapeHtml(creator)}</div>
          <div><b>Verifier:</b> ${escapeHtml(verifier)}</div>
          <div><b>Verified:</b> ${escapeHtml(verified)}</div>
          <div><b>Source:</b> ${escapeHtml(source)}</div>
        </div>
      </div>
      <div class="level-actions">${actions}</div>
    </article>`;
}

function placeholderThumbnail(){
  return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" width="300" height="170">
      <rect width="100%" height="100%" fill="#11151e"/>
      <text x="50%" y="50%" fill="#777" font-size="18" text-anchor="middle" dominant-baseline="middle">No Thumbnail</text>
    </svg>`);
}

function selectList(id){
  state.selectedListId=id;
  save();
  render();
}

function openCreateList(){
  openModal("Create Demonlist",`
    <div class="field">
      <label>Demonlist name</label>
      <input id="listNameInput" class="input" maxlength="60" placeholder="My Top Demons">
    </div>
  `,`
    <button class="button" onclick="closeModal()">Cancel</button>
    <button class="button primary" onclick="createList()">Create</button>
  `);
}

function createList(){
  const name=$("listNameInput").value.trim();
  if(!name){
    showToast("Enter a list name.");
    return;
  }
  const l={
    id:uid(),
    name:name.slice(0,60),
    levels:[],
    createdAt:Date.now(),
    updatedAt:Date.now()
  };
  state.lists.push(l);
  state.selectedListId=l.id;
  save();
  closeModal();
  render();
  showToast("Demonlist created!");
}

function openRenameList(){
  const list=getSelectedList();
  if(!list)return;
  openModal("Rename Demonlist",`
    <div class="field">
      <label>New name</label>
      <input id="renameInput" class="input" maxlength="60" value="${escapeAttribute(list.name)}">
    </div>
  `,`
    <button class="button" onclick="closeModal()">Cancel</button>
    <button class="button primary" onclick="renameList()">Save</button>
  `);
}

function renameList(){
  const list=getSelectedList();
  const name=$("renameInput").value.trim();
  if(!list||!name)return;
  list.name=name.slice(0,60);
  touch(list);
  save();
  closeModal();
  render();
}

function deleteList(){
  const list=getSelectedList();
  if(!list)return;

  if(state.lists.length===1){
    showToast("You need to keep at least one Demonlist.");
    return;
  }

  if(!confirm(`Delete "${list.name}"? This cannot be undone.`))return;

  state.lists=state.lists.filter(x=>x.id!==list.id);
  state.selectedListId=state.lists[0].id;
  save();
  render();
  showToast("Demonlist deleted.");
}

function touch(list){

async function searchLevels(){
  const query=$("levelSearchInput").value.trim();
  if(!query){
    showToast("Enter a level name.");
    return;
  }

  $("searchResults").innerHTML=`<div class="empty" style="padding:25px">Searching Pointercrate + AREDL...</div>`;

  const [p,a]=await Promise.allSettled([
    searchPointercrate(query),
    searchAREDL(query)
  ]);

  let results=[];
  if(p.status==="fulfilled")results.push(...p.value);
  if(a.status==="fulfilled")results.push(...a.value);

  results=dedupeResults(results).slice(0,25);
  currentSearch=results;

  if(!results.length){
    $("searchResults").innerHTML=`
      <div class="notice">
        No matching level was found on Pointercrate or AREDL.
        You can still add it manually as a custom level.
      </div>
      <button class="button primary" style="width:100%" onclick="openCustomLevel()">
        + Add Custom Level
      </button>`;
    return;
  }

  $("searchResults").innerHTML=results.map((r,i)=>`
    <div class="result">
      <div class="result-info">
        <div class="result-name">${escapeHtml(r.name)}</div>
        <div class="result-meta">
          ${escapeHtml(r.creator||"Unknown creator")}
          ${r.verifier?" • Verified by "+escapeHtml(r.verifier):""}
          ${r.source?" • "+escapeHtml(r.source):""}
        </div>
      </div>
      <div class="result-right">
        ${r.videoUrl?`<span class="badge video">VIDEO ✓</span>`:""}
        <button class="button small primary" onclick="addImportedLevelByIndex(${i})">Add</button>
      </div>
    </div>
  `).join("");
}

async function searchPointercrate(query){
  const url=POINTERCRATE+"?search="+encodeURIComponent(query)+"&limit=25";
  const res=await fetch(url);
  if(!res.ok)throw new Error("Pointercrate request failed");
  const data=await res.json();
  const arr=Array.isArray(data)?data:(data.results||data.data||[]);
  return arr.map(x=>normalizeLevel(x,"Pointercrate")).filter(x=>x.name);
}

async function searchAREDL(query){
  const url=AREDL+"?name="+encodeURIComponent(query);
  const res=await fetch(url);
  if(!res.ok)throw new Error("AREDL request failed");
  const data=await res.json();
  const arr=Array.isArray(data)?data:(data.data||data.results||data.levels||[]);
  return arr.map(x=>normalizeLevel(x,"AREDL")).filter(x=>x.name);
}

function dedupeResults(arr){
  const seen=new Set();
  return arr.filter(x=>{
    const key=(x.gdId||x.levelId||x.name||"").toString().toLowerCase();
    if(seen.has(key))return false;
    seen.add(key);
    return true;
  });
}

function normalizeLevel(x,source){
  const name=firstValue(x,[
    "name","level_name","levelName","title"
  ])||"";

  const creator=firstValue(x,[
    "creator","creator_name","creatorName","author","author_name"
  ])||"";

  const verifier=firstValue(x,[
    "verifier","verifier_name","verifierName","verified_by","verifiedBy"
  ])||"";

  const verifiedDate=firstValue(x,[
    "verified_date","verifiedDate","verification_date","verificationDate"
  ])||"";

  const gdId=firstValue(x,[
    "id","level_id","levelId","gd_id","gdId"
  ])||"";

  const videoUrl=findVideoUrlInObject(x);

  return {
    api:x,
    name:String(name),
    creator:String(creator),
    verifier:String(verifier),
    verifiedDate:normalizeDate(verifiedDate),
    gdId:String(gdId),
    source,
    videoUrl:videoUrl||"",
    thumbnail:youtubeThumbnail(videoUrl)
  };
}

function firstValue(obj,keys){
  for(const key of keys){
    if(obj&&obj[key]!==undefined&&obj[key]!==null&&String(obj[key]).trim()!==""){
      return obj[key];
    }
  }
  return "";
}

function findVideoUrlInObject(obj,depth=0){
  if(!obj||depth>5)return "";

  const preferred=[
    "video_url","videoUrl","video",
    "verification_video","verificationVideo",
    "verification_video_url","verificationVideoUrl",
    "youtube_url","youtubeUrl","youtube",
    "proof","proof_url","proofUrl",
    "video_link","videoLink","url"
  ];

  for(const key of preferred){
    if(obj[key]&&typeof obj[key]==="string"&&looksLikeVideo(obj[key])){
      return obj[key];
    }
  }

  for(const [key,val] of Object.entries(obj)){
    if(typeof val==="string"&&/(video|youtube|proof)/i.test(key)&&looksLikeVideo(val)){
      return val;
    }
  }

  for(const val of Object.values(obj)){
    if(val&&typeof val==="object"){
      const found=findVideoUrlInObject(val,depth+1);
      if(found)return found;
    }
  }

  return "";
}

function looksLikeVideo(url){
  return /youtu\.be|youtube\.com|youtube-nocookie\.com/i.test(String(url));
}

function normalizeDate(v){
  if(!v)return "";
  const d=new Date(v);
  if(Number.isNaN(d.getTime()))return "";
  return d.toISOString().slice(0,10);
}

function youtubeId(url){
  if(!url)return "";
  const s=String(url).trim();

  let m=s.match(/youtu\.be\/([^?&#/]+)/i);
  if(m)return m[1];

  m=s.match(/youtube(?:-nocookie)?\.com\/(?:watch\?v=|shorts\/|embed\/|live\/)([^?&#/]+)/i);
  if(m)return m[1];

  m=s.match(/[?&]v=([^?&#/]+)/i);
  if(m)return m[1];

  return "";
}

function youtubeThumbnail(url){
  const id=youtubeId(url);
  return id?`https://img.youtube.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`:"";
}

function addImportedLevelByIndex(index){

}

function addImportedLevel(apiLevel){
  const list=getSelectedList();
  if(!list||!apiLevel)return;

  const level={
    id:uid(),
    name:apiLevel.name||"Unnamed Level",
    creator:apiLevel.creator||"",
    verifier:apiLevel.verifier||"",
    verifiedDate:apiLevel.verifiedDate||"",
    source:apiLevel.source||"Unknown",
    videoUrl:apiLevel.videoUrl||"",
    thumbnail:apiLevel.thumbnail||youtubeThumbnail(apiLevel.videoUrl||""),
    addedAt:Date.now()
  };

  list.levels.push(level);
  touch(list);
  save();
  closeModal();
  render();
  showToast("Level added!");
}

function saveLevel(id){
  const list=getSelectedList();
  const level=list?.levels.find(x=>x.id===id);
  if(!level)return;

  const name=$("editName").value.trim();
  if(!name){
    showToast("Level name is required.");
    return;
  }

  const video=$("editVideo").value.trim();

  level.name=name;
  level.creator=$("editCreator").value.trim();
  level.verifier=$("editVerifier").value.trim();
  level.verifiedDate=$("editDate").value;
  level.videoUrl=video;
  level.thumbnail=youtubeThumbnail(video)||level.thumbnail;
  level.source=$("editSource").value.trim()||"Custom";

  touch(list);
  save();
  closeModal();
  render();
  showToast("Level updated!");
}

function deleteLevel(id){
  const list=getSelectedList();
  if(!list)return;

  const index=list.levels.findIndex(x=>x.id===id);
  if(index<0)return;

  const level=list.levels[index];

  if(!confirm(`Delete "${level.name}" from this Demonlist?`))return;

  list.levels.splice(index,1);
  touch(list);
  save();
  render();
  showToast("Level deleted.");
}

function moveLevel(id,direction){
  const list=getSelectedList();
  if(!list)return;

  const index=list.levels.findIndex(x=>x.id===id);
  if(index<0)return;

  const newIndex=index+direction;

  if(newIndex<0||newIndex>=list.levels.length){
    showToast(direction<0?"Already #1.":"Already at the bottom.");
    return;
  }

  [list.levels[index],list.levels[newIndex]]=
    [list.levels[newIndex],list.levels[index]];

  touch(list);
  save();
  render();
}

function setLevelSpot(id){
  const list=getSelectedList();
  if(!list)return;

  const index=list.levels.findIndex(x=>x.id===id);
  if(index<0)return;

  const requested=prompt(
    `Set "${list.levels[index].name}" to which spot?\nEnter a number from 1 to ${list.levels.length}.`,
    String(index+1)
  );

  if(requested===null)return;

  const spot=Number.parseInt(requested,10);

  if(!Number.isInteger(spot)||spot<1||spot>list.levels.length){
    showToast("Invalid spot.");
    return;
  }

  const [level]=list.levels.splice(index,1);
  list.levels.splice(spot-1,0,level);

  touch(list);
  save();
  render();
  showToast(`Moved to #${spot}.`);
}

function exportData(){
  if(publicList)return;

  const data=JSON.stringify(state,null,2);
  const blob=new Blob([data],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="createyourdemonlist-backup.json";
  a.click();
  URL.revokeObjectURL(url);
  showToast("Backup exported!");
}

function importData(){
  try{
    const parsed=JSON.parse($("importText").value);

    if(!parsed||typeof parsed!=="object"||!Array.isArray(parsed.lists)){
      throw new Error("Invalid backup");
    }

    if(!confirm("Importing will replace your current local data. Continue?"))return;

    state={
      username:String(parsed.username||""),
      lists:parsed.lists,
      selectedListId:parsed.selectedListId||""
    };

    state.lists.forEach(l=>{
      if(!l.id)l.id=uid();
      if(!Array.isArray(l.levels))l.levels=[];
      l.levels.forEach(x=>{
        if(!x.id)x.id=uid();
        x.name=x.name||"Unnamed Level";
        x.creator=x.creator||"";
        x.verifier=x.verifier||"";
        x.verifiedDate=x.verifiedDate||"";
        x.source=x.source||"Custom";
        x.videoUrl=x.videoUrl||"";
        x.thumbnail=x.thumbnail||youtubeThumbnail(x.videoUrl);
      });
    });

    ensureList();
    save();
    closeModal();
    render();
    showToast("Backup imported!");
  }catch(e){
    showToast("Invalid backup JSON.");
  }
}

function resetEverything(){
  if(!confirm("Delete ALL local Demonlists and your local profile?"))return;

  localStorage.removeItem(STORAGE_KEY);
  state={username:"",lists:[],selectedListId:""};
  closeModal();
  ensureList();
  $("setup").classList.add("show");
  render();
}

function modalOutside(e){
  if(e.target===$("modalBg"))closeModal();
}

function timeAgo(timestamp){
  return relativeTime(Date.now()-Number(timestamp));
}

function timeAgoDate(dateString){
  if(!dateString)return"Not specified";

  const d=new Date(dateString+"T00:00:00");
  if(Number.isNaN(d.getTime()))return"Unknown";

  return relativeTime(Date.now()-d.getTime());
}

function relativeTime(diff){
  if(diff<0)return"Just Now";

  const minute=60*1000;
  const hour=60*minute;
  const day=24*hour;
  const month=30.4375*day;
  const year=365.25*day;

  if(diff>=year){
    const n=Math.floor(diff/year);
    return n+" "+(n===1?"Year":"Years")+" Ago";
  }

  if(diff>=month){
    const n=Math.floor(diff/month);
    return n+" "+(n===1?"Month":"Months")+" Ago";
  }

  if(diff>=day){
    const n=Math.floor(diff/day);
    return n+" "+(n===1?"Day":"Days")+" Ago";
  }

  if(diff>=hour){
    const n=Math.floor(diff/hour);
    return n+" "+(n===1?"Hour":"Hours")+" Ago";
  }

  if(diff>=minute){
    const n=Math.floor(diff/minute);
    return n+" "+(n===1?"Minute":"Minutes")+" Ago";
  }

  return"Just Now";
}

function shareCurrentList(){
  const list=getSelectedList();
  if(!list||publicList)return;

  const publicData={
    version:1,
    username:state.username,
    list:{
      name:list.name,
      levels:list.levels.map(x=>({
        name:x.name,
        creator:x.creator||"",
        verifier:x.verifier||"",
        verifiedDate:x.verifiedDate||"",
        source:x.source||"Custom",
        videoUrl:x.videoUrl||"",
        thumbnail:x.thumbnail||""
      })),
      updatedAt:list.updatedAt||Date.now()
    }
  };

  try{
    const json=JSON.stringify(publicData);
    const encoded=base64Encode(json);
    const url=location.origin+location.pathname+"#public="+encoded;

    navigator.clipboard?.writeText(url).then(()=>{
      showToast("Public link copied!");
    }).catch(()=>{
      openShareModal(url);
    });

    if(!navigator.clipboard){
      openShareModal(url);
    }
  }catch(e){
    showToast("Could not create public link.");
  }
}

function openShareModal(url){
  openModal("Public Demonlist Link",`
    <div class="notice">
      Anyone with this link can view this Demonlist.
      The public page is read-only.
    </div>
    <div class="field">
      <label>Share link</label>
      <textarea class="input" rows="5" readonly onclick="this.select()">${escapeHtml(url)}</textarea>
    </div>
  `,`
    <button class="button" onclick="closeModal()">Close</button>
  `);
}

function base64Encode(str){
  const bytes=new TextEncoder().encode(str);
  let binary="";
  const chunk=0x8000;

  for(let i=0;i<bytes.length;i+=chunk){
    binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
  }

  return btoa(binary)
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=+$/,"");
}

function base64Decode(str){
  str=str.replace(/-/g,"+").replace(/_/g,"/");
  while(str.length%4)str+="=";

  const binary=atob(str);
  const bytes=new Uint8Array(binary.length);

  for(let i=0;i<binary.length;i++){
    bytes[i]=binary.charCodeAt(i);
  }

  return new TextDecoder().decode(bytes);
}

function loadPublicFromHash(){
  try{
    const encoded=location.hash.slice("#public=".length);

    if(!encoded)throw new Error("Missing data");

    const parsed=JSON.parse(base64Decode(encoded));

    if(
      !parsed||
      parsed.version!==1||
      !parsed.list||
      !Array.isArray(parsed.list.levels)
    ){
      throw new Error("Invalid public list");
    }

    publicList=parsed;

    document.body.classList.add("public-mode");
    $("setup").classList.remove("show");

    renderPublic();
  }catch(e){
    publicList=null;

    $("main").innerHTML=`
      <div class="panel">
        <div class="panel-body empty">
          <div style="font-size:40px">⚠️</div>
          <h2 style="color:#fff">Invalid Public Demonlist</h2>
          <p>This public link is missing data or has been corrupted.</p>
          <button class="button primary" onclick="location.href=location.pathname">Go Home</button>
        </div>
      </div>`;
  }
}

function renderPublic(){
  if(!publicList)return;

  const p=publicList;
  const list=p.list;

  $("publicBanner").classList.remove("hidden");
  $("publicBanner").innerHTML=
    `Public Demonlist • Created by <b>${escapeHtml(p.username||"Unknown")}</b> • Read-only`;

  $("pageTitle").textContent=list.name||"Public Demonlist";
  $("pageSubtitle").textContent="Created by "+(p.username||"Unknown");
  $("statLevels").textContent=list.levels.length;
  $("statRanked").textContent=list.levels.length;
  $("statUpdated").textContent=list.updatedAt?timeAgo(list.updatedAt):"Unknown";
  $("listUpdated").textContent=list.updatedAt?"Updated "+timeAgo(list.updatedAt):"";

  $("heroActions").innerHTML=`
    <button class="button" onclick="copyCurrentPublicLink()">Copy Link</button>
    <button class="button primary" onclick="location.href=location.pathname">Create Your Own</button>
  `;

  $("listSidebar").innerHTML="";

  if(!list.levels.length){
    $("levels").innerHTML=`
      <div class="empty">
        <div style="font-size:35px">🏆</div>
        <div style="margin-top:8px">This Demonlist has no levels.</div>
      </div>`;
    return;
  }

  $("levels").innerHTML=list.levels.map((level,i)=>
    renderLevelCard(level,i,true)
  ).join("");
}

function copyCurrentPublicLink(){
  navigator.clipboard?.writeText(location.href)
    .then(()=>showToast("Public link copied!"))
    .catch(()=>openShareModal(location.href));
}

window.addEventListener("hashchange",()=>{
  if(location.hash.startsWith("#public=")){
    loadPublicFromHash();
  }else{
    publicList=null;
    document.body.classList.remove("public-mode");
    location.reload();
  }
});
