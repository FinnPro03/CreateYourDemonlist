<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreateYourDemonlist</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #0b0d12;
        color: #f4f6fb;
    }

    button,
    input {
        font: inherit;
    }

    button {
        cursor: pointer;
    }

    .hidden {
        display: none !important;
    }

    /* HEADER */

    header {
        height: 68px;
        background: #11151d;
        border-bottom: 1px solid #252b38;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        position: sticky;
        top: 0;
        z-index: 50;
    }

    .logo {
        font-size: 21px;
        font-weight: 800;
        color: #ffffff;
    }

    .logo span {
        color: #ff334d;
    }

    .header-buttons {
        display: flex;
        gap: 8px;
    }

    .header-btn {
        background: #1a202b;
        border: 1px solid #2c3442;
        color: #fff;
        padding: 9px 13px;
        border-radius: 9px;
    }

    .header-btn:hover {
        background: #222a37;
    }

    /* PROFILE SETUP */

    .setup-screen {
        min-height: calc(100vh - 68px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 25px;
    }

    .setup-card {
        width: min(500px, 100%);
        background: #11151d;
        border: 1px solid #292f3b;
        border-radius: 18px;
        padding: 35px;
        text-align: center;
        box-shadow: 0 20px 70px rgba(0,0,0,.35);
    }

    .setup-icon {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: #ff334d;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 34px;
        font-weight: 900;
    }

    .setup-card h1 {
        margin: 0 0 10px;
    }

    .setup-card p {
        color: #929aaa;
        line-height: 1.5;
    }

    .username-input {
        width: 100%;
        margin-top: 20px;
        background: #0b0e14;
        color: white;
        border: 1px solid #303746;
        padding: 14px;
        border-radius: 10px;
        outline: none;
    }

    .username-input:focus {
        border-color: #ff334d;
    }

    .primary-btn {
        background: #ff334d;
        color: white;
        border: none;
        padding: 13px 18px;
        border-radius: 10px;
        font-weight: 700;
    }

    .primary-btn:hover {
        background: #ff4d63;
    }

    .setup-card .primary-btn {
        width: 100%;
        margin-top: 12px;
    }

    /* APP */

    .app {
        min-height: calc(100vh - 68px);
        display: flex;
    }

    .sidebar {
        width: 275px;
        flex-shrink: 0;
        background: #0f131a;
        border-right: 1px solid #252b36;
        padding: 20px;
        min-height: calc(100vh - 68px);
    }

    .profile-box {
        background: #171c25;
        border: 1px solid #292f3a;
        border-radius: 13px;
        padding: 14px;
        margin-bottom: 20px;
    }

    .profile-row {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #ff334d;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 18px;
    }

    .profile-name {
        font-weight: 800;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .profile-count {
        font-size: 12px;
        color: #8992a2;
        margin-top: 4px;
    }

    .sidebar-title {
        color: #7f8898;
        font-size: 12px;
        text-transform: uppercase;
        font-weight: 800;
        margin: 20px 4px 8px;
        letter-spacing: .8px;
    }

    .list-item {
        width: 100%;
        background: transparent;
        border: none;
        color: #d8dce5;
        padding: 11px;
        border-radius: 8px;
        text-align: left;
        margin-bottom: 3px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
    }

    .list-item:hover {
        background: #191f29;
    }

    .list-item.active {
        background: #252c38;
        color: white;
    }

    .list-item-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .list-number {
        color: #737c8d;
        font-size: 12px;
    }

    .new-list-btn {
        width: 100%;
        background: #171d27;
        border: 1px dashed #394252;
        color: #b9c0cc;
        padding: 11px;
        border-radius: 9px;
        margin-top: 8px;
    }

    .new-list-btn:hover {
        background: #202733;
    }

    /* MAIN */

    main {
        flex: 1;
        min-width: 0;
        padding: 30px;
    }

    .welcome {
        color: #8992a2;
        margin-bottom: 25px;
    }

    .list-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
    }

    .list-title {
        font-size: 30px;
        margin: 0;
        word-break: break-word;
    }

    .list-actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
    }

    .secondary-btn {
        background: #171d27;
        border: 1px solid #303847;
        color: white;
        padding: 10px 14px;
        border-radius: 9px;
    }

    .secondary-btn:hover {
        background: #222936;
    }

    .danger-btn {
        background: #27151a;
        border: 1px solid #5b2631;
        color: #ff8997;
        padding: 10px 14px;
        border-radius: 9px;
    }

    .danger-btn:hover {
        background: #35191f;
    }

    .empty {
        border: 1px dashed #343c4a;
        border-radius: 14px;
        padding: 55px 20px;
        text-align: center;
        color: #808999;
    }

    .empty strong {
        display: block;
        color: #cbd0da;
        font-size: 18px;
        margin-bottom: 8px;
    }

    /* LEVEL TABLE */

    .level-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .level-row {
        min-height: 82px;
        background: #11161e;
        border: 1px solid #252c38;
        border-radius: 12px;
        display: grid;
        grid-template-columns: 55px 76px minmax(0, 1fr) 100px 90px 130px;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
    }

    .level-row:hover {
        border-color: #343d4c;
    }

    .rank {
        font-size: 21px;
        font-weight: 900;
        text-align: center;
        color: #929aaa;
    }

    .level-thumb {
        width: 76px;
        height: 52px;
        border-radius: 7px;
        object-fit: cover;
        background: #202630;
    }

    .level-name {
        font-weight: 800;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .level-creator {
        color: #7f8898;
        font-size: 12px;
        margin-top: 5px;
    }

    .points {
        font-weight: 900;
        color: #ffd15c;
        text-align: right;
    }

    .source {
        color: #778092;
        font-size: 11px;
        text-align: center;
        text-transform: uppercase;
    }

    .level-actions {
        display: flex;
        justify-content: flex-end;
        gap: 5px;
    }

    .small-btn {
        background: #1b212b;
        border: 1px solid #303847;
        color: white;
        border-radius: 7px;
        padding: 7px 9px;
        font-size: 12px;
    }

    .small-btn:hover {
        background: #272f3b;
    }

    /* MODAL */

    .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.72);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        z-index: 100;
    }

    .modal {
        width: min(700px, 100%);
        max-height: 90vh;
        overflow-y: auto;
        background: #11161e;
        border: 1px solid #2b333f;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 30px 100px rgba(0,0,0,.55);
    }

    .modal h2 {
        margin-top: 0;
    }

    .modal-close {
        float: right;
        background: transparent;
        border: none;
        color: #8d96a6;
        font-size: 23px;
    }

    .form-label {
        display: block;
        color: #aeb5c1;
        font-size: 13px;
        font-weight: 700;
        margin: 14px 0 6px;
    }

    .form-input {
        width: 100%;
        background: #0b0f15;
        border: 1px solid #303846;
        border-radius: 9px;
        color: white;
        padding: 12px;
        outline: none;
    }

    .form-input:focus {
        border-color: #ff334d;
    }

    .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 20px;
    }

    /* SEARCH */

    .search-box {
        display: flex;
        gap: 8px;
    }

    .search-box input {
        flex: 1;
    }

    .search-results {
        margin-top: 15px;
        display: flex;
        flex-direction: column;
        gap: 7px;
    }

    .search-result {
        width: 100%;
        background: #171d26;
        border: 1px solid #29313e;
        border-radius: 10px;
        padding: 11px;
        color: white;
        display: flex;
        align-items: center;
        gap: 12px;
        text-align: left;
    }

    .search-result:hover {
        background: #202733;
        border-color: #404a5b;
    }

    .result-thumb {
        width: 70px;
        height: 45px;
        object-fit: cover;
        border-radius: 6px;
        background: #242b36;
        flex-shrink: 0;
    }

    .result-info {
        min-width: 0;
    }

    .result-name {
        font-weight: 800;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .result-meta {
        color: #7e8797;
        font-size: 12px;
        margin-top: 4px;
    }

    .loading {
        color: #929aaa;
        padding: 15px 0;
    }

    .error {
        color: #ff7787;
        background: #28151a;
        border: 1px solid #54232d;
        padding: 12px;
        border-radius: 9px;
        margin-top: 12px;
    }

    /* PROFILE MODAL */

    .big-profile {
        text-align: center;
        padding: 15px;
    }

    .big-avatar {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        margin: 0 auto 15px;
        background: #ff334d;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 35px;
        font-weight: 900;
    }

    .stats {
        display: flex;
        justify-content: center;
        gap: 35px;
        margin-top: 20px;
    }

    .stat-number {
        font-size: 25px;
        font-weight: 900;
    }

    .stat-label {
        color: #7e8797;
        font-size: 12px;
        margin-top: 3px;
    }

    /* MOBILE */

    @media (max-width: 900px) {
        .sidebar {
            width: 220px;
        }

        .level-row {
            grid-template-columns: 42px 60px minmax(0, 1fr) 75px;
        }

        .level-thumb {
            width: 60px;
            height: 45px;
        }

        .source,
        .level-actions {
            display: none;
        }
    }

    @media (max-width: 650px) {
        header {
            padding: 0 12px;
        }

        .logo {
            font-size: 17px;
        }

        .sidebar {
            width: 100%;
            min-height: auto;
            border-right: none;
            border-bottom: 1px solid #252b36;
        }

        .app {
            display: block;
        }

        main {
            padding: 18px 12px;
        }

        .sidebar {
            padding: 12px;
        }

        .sidebar-title {
            margin-top: 12px;
        }

        .list-item {
            display: inline-flex;
            width: auto;
            margin-right: 4px;
        }

        .new-list-btn {
            margin-bottom: 8px;
        }

        .level-row {
            grid-template-columns: 38px 58px minmax(0, 1fr) 65px;
            gap: 7px;
            padding: 8px;
        }

        .level-thumb {
            width: 58px;
            height: 42px;
        }

        .level-actions {
            display: none;
        }

        .list-header {
            align-items: flex-start;
            flex-direction: column;
        }

        .list-actions {
            width: 100%;
        }

        .list-actions button {
            flex: 1;
        }

        .header-buttons .header-btn {
            padding: 7px 9px;
            font-size: 12px;
        }
    }
</style>
</head>

<body>

<header>
    <div class="logo">Create<span>Your</span>Demonlist</div>

    <div class="header-buttons">
        <button class="header-btn" onclick="openProfile()">👤 Profile</button>
        <button class="header-btn" onclick="changeUsername()">✏️ Username</button>
    </div>
</header>


<!-- FIRST-TIME PROFILE SETUP -->

<section id="setupScreen" class="setup-screen">
    <div class="setup-card">
        <div class="setup-icon">D</div>

        <h1>CreateYourDemonlist</h1>

        <p>
            Create your local profile and start making your own Geometry Dash Demonlists.
        </p>

        <input
            id="usernameInput"
            class="username-input"
            maxlength="30"
            placeholder="Enter your username..."
        >

        <button class="primary-btn" onclick="createProfile()">
            Continue
        </button>
    </div>
</section>


<!-- MAIN APP -->

<div id="app" class="app hidden">

    <aside class="sidebar">

        <div class="profile-box">
            <div class="profile-row">
                <div id="avatar" class="avatar">?</div>

                <div>
                    <div id="profileName" class="profile-name">Username</div>
                    <div id="profileCount" class="profile-count">
                        0 Demonlists
                    </div>
                </div>
            </div>
        </div>

        <div class="sidebar-title">Your Demonlists</div>

        <div id="listContainer"></div>

        <button class="new-list-btn" onclick="createList()">
            + Create Demonlist
        </button>

    </aside>


    <main>

        <div id="welcomeText" class="welcome"></div>

        <div id="listArea"></div>

    </main>

</div>


<!-- MODAL -->

<div id="modalBackdrop" class="modal-backdrop hidden" onclick="closeModalOutside(event)">
    <div id="modal" class="modal"></div>
</div>


<script>

/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY = "createYourDemonlist_v1";

let state = loadState();

function loadState() {

    try {

        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) {
            return {
                username: "",
                lists: [],
                selectedListId: null
            };
        }

        const data = JSON.parse(saved);

        return {
            username: data.username || "",
            lists: Array.isArray(data.lists) ? data.lists : [],
            selectedListId: data.selectedListId || null
        };

    } catch (error) {

        console.error(error);

        return {
            username: "",
            lists: [],
            selectedListId: null
        };
    }
}


function saveState() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );
}


/* =========================================================
   INITIALIZATION
========================================================= */

function initialize() {

    if (!state.username) {

        document
            .getElementById("setupScreen")
            .classList.remove("hidden");

        document
            .getElementById("app")
            .classList.add("hidden");

        return;
    }

    document
        .getElementById("setupScreen")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

    if (
        !state.selectedListId ||
        !state.lists.some(x => x.id === state.selectedListId)
    ) {

        state.selectedListId =
            state.lists.length
                ? state.lists[0].id
                : null;

        saveState();
    }

    render();
}

initialize();


/* =========================================================
   PROFILE
========================================================= */

function createProfile() {

    const input =
        document.getElementById("usernameInput");

    const username =
        input.value.trim();

    if (!username) {

        alert("Please enter a username.");

        input.focus();

        return;
    }

    state.username = username;

    saveState();

    initialize();
}


function changeUsername() {

    const newName =
        prompt(
            "Enter your new username:",
            state.username
        );

    if (newName === null) return;

    const clean =
        newName.trim();

    if (!clean) {

        alert("Username cannot be empty.");

        return;
    }

    state.username =
        clean.slice(0, 30);

    saveState();

    render();
}


function openProfile() {

    const count =
        state.lists.length;

    const totalLevels =
        state.lists.reduce(
            (total, list) =>
                total + list.levels.length,
            0
        );

    openModal(`

        <button
            class="modal-close"
            onclick="closeModal()"
        >×</button>

        <div class="big-profile">

            <div class="big-avatar">
                ${escapeHtml(
                    state.username
                        .charAt(0)
                        .toUpperCase()
                )}
            </div>

            <h2>
                ${escapeHtml(state.username)}
            </h2>

            <div class="stats">

                <div>
                    <div class="stat-number">
                        ${count}
                    </div>

                    <div class="stat-label">
                        Demonlists
                    </div>
                </div>

                <div>
                    <div class="stat-number">
                        ${totalLevels}
                    </div>

                    <div class="stat-label">
                        Levels Added
                    </div>
                </div>

            </div>

        </div>
    `);
}


/* =========================================================
   DEMONLIST CREATION
========================================================= */

function createList() {

    const name =
        prompt(
            "What should your Demonlist be called?"
        );

    if (name === null) return;

    const clean =
        name.trim();

    if (!clean) {

        alert("The list needs a name.");

        return;
    }

    const list = {

        id:
            crypto.randomUUID
                ? crypto.randomUUID()
                : Date.now().toString(),

        name:
            clean.slice(0, 100),

        levels: [],

        createdAt:
            Date.now(),

        updatedAt:
            Date.now()
    };

    state.lists.push(list);

    state.selectedListId =
        list.id;

    saveState();

    render();
}


function renameList() {

    const list =
        getSelectedList();

    if (!list) return;

    const name =
        prompt(
            "New Demonlist name:",
            list.name
        );

    if (name === null) return;

    const clean =
        name.trim();

    if (!clean) {

        alert("The list needs a name.");

        return;
    }

    list.name =
        clean.slice(0, 100);

    list.updatedAt =
        Date.now();

    saveState();

    render();
}


function deleteList() {

    const list =
        getSelectedList();

    if (!list) return;

    const confirmed =
        confirm(
            `Delete "${list.name}"?\n\nThis will remove all levels from this local list.`
        );

    if (!confirmed) return;

    state.lists =
        state.lists.filter(
            x => x.id !== list.id
        );

    state.selectedListId =
        state.lists.length
            ? state.lists[0].id
            : null;

    saveState();

    render();
}


function selectList(id) {

    state.selectedListId =
        id;

    saveState();

    render();
}


function getSelectedList() {

    return state.lists.find(
        x => x.id === state.selectedListId
    );
}


/* =========================================================
   RENDER
========================================================= */

function render() {

    document.getElementById("profileName")
        .textContent = state.username;

    document.getElementById("profileCount")
        .textContent =
            `${state.lists.length} ${
                state.lists.length === 1
                    ? "Demonlist"
                    : "Demonlists"
            }`;

    document.getElementById("avatar")
        .textContent =
            state.username
                .charAt(0)
                .toUpperCase();

    document.getElementById("welcomeText")
        .textContent =
            `Welcome, ${state.username}. Build your own rankings.`;

    renderSidebar();
    renderList();
}


function renderSidebar() {

    const container =
        document.getElementById("listContainer");

    container.innerHTML = "";

    state.lists.forEach(
        (list, index) => {

            const button =
                document.createElement("button");

            button.className =
                "list-item" +
                (
                    list.id === state.selectedListId
                        ? " active"
                        : ""
                );

            button.onclick =
                () => selectList(list.id);

            button.innerHTML = `

                <span class="list-item-name">
                    ${escapeHtml(list.name)}
                </span>

                <span class="list-number">
                    ${list.levels.length}
                </span>

            `;

            container.appendChild(button);
        }
    );
}


function renderList() {

    const area =
        document.getElementById("listArea");

    const list =
        getSelectedList();

    if (!list) {

        area.innerHTML = `

            <div class="empty">

                <strong>No Demonlists yet.</strong>

                Create your first Demonlist from
                the sidebar.

                <br><br>

                <button
                    class="primary-btn"
                    onclick="createList()"
                >
                    + Create Demonlist
                </button>

            </div>

        `;

        return;
    }

    area.innerHTML = `

        <div class="list-header">

            <h1 class="list-title">
                ${escapeHtml(list.name)}
            </h1>

            <div class="list-actions">

                <button
                    class="secondary-btn"
                    onclick="openAddLevel()"
                >
                    + Add Level
                </button>

                <button
                    class="secondary-btn"
                    onclick="renameList()"
                >
                    ✏️ Rename
                </button>

                <button
                    class="danger-btn"
                    onclick="deleteList()"
                >
                    🗑 Delete
                </button>

            </div>

        </div>

        <div id="levelList"></div>
    `;

    renderLevels();
}


/* =========================================================
   LEVELS
========================================================= */

function renderLevels() {

    const list =
        getSelectedList();

    const container =
        document.getElementById("levelList");

    if (!list || !container) return;

    if (!list.levels.length) {

        container.innerHTML = `

            <div class="empty">

                <strong>This Demonlist is empty.</strong>

                Search for a real Geometry Dash level
                to add it.

                <br><br>

                <button
                    class="primary-btn"
                    onclick="openAddLevel()"
                >
                    🔎 Search Levels
                </button>

            </div>

        `;

        return;
    }

    list.levels.sort(
        (a, b) =>
            Number(b.points) -
            Number(a.points)
    );

    container.innerHTML =
        `<div class="level-list"></div>`;

    const levelList =
        container.querySelector(".level-list");

    list.levels.forEach(
        (level, index) => {

            const row =
                document.createElement("div");

            row.className =
                "level-row";

            row.innerHTML = `

                <div class="rank">
                    #${index + 1}
                </div>

                <img
                    class="level-thumb"
                    src="${escapeAttribute(
                        level.thumbnail ||
                        createFallbackThumbnail()
                    )}"
                    onerror="this.src='${createFallbackThumbnail()}'"
                >

                <div>

                    <div class="level-name">
                        ${escapeHtml(level.name)}
                    </div>

                    <div class="level-creator">
                        ${escapeHtml(
                            level.creator || "Unknown creator"
                        )}
                    </div>

                </div>

                <div class="points">
                    ${formatPoints(level.points)}
                </div>

                <div class="source">
                    ${escapeHtml(
                        level.source || "GD"
                    )}
                </div>

                <div class="level-actions">

                    <button
                        class="small-btn"
                        onclick="editLevel('${escapeAttribute(level.id)}')"
                    >
                        ✏️
                    </button>

                    <button
                        class="small-btn"
                        onclick="deleteLevel('${escapeAttribute(level.id)}')"
                    >
                        🗑
                    </button>

                </div>
            `;

            levelList.appendChild(row);
        }
    );
}


function formatPoints(points) {

    const number =
        Number(points);

    if (!Number.isFinite(number)) {
        return "0";
    }

    return Number.isInteger(number)
        ? number.toLocaleString()
        : number.toLocaleString(
            undefined,
            {
                maximumFractionDigits: 2
            }
        );
}


function deleteLevel(id) {

    const list =
        getSelectedList();

    if (!list) return;

    const level =
        list.levels.find(
            x => x.id === id
        );

    if (!level) return;

    if (
        !confirm(
            `Remove "${level.name}" from this Demonlist?`
        )
    ) {
        return;
    }

    list.levels =
        list.levels.filter(
            x => x.id !== id
        );

    list.updatedAt =
        Date.now();

    saveState();

    render();
}


function editLevel(id) {

    const list =
        getSelectedList();

    if (!list) return;

    const level =
        list.levels.find(
            x => x.id === id
        );

    if (!level) return;

    openModal(`

        <button
            class="modal-close"
            onclick="closeModal()"
        >×</button>

        <h2>Edit Level</h2>

        <label class="form-label">
            Level Name
        </label>

        <input
            id="editName"
            class="form-input"
            value="${escapeAttribute(level.name)}"
        >

        <label class="form-label">
            Creator
        </label>

        <input
            id="editCreator"
            class="form-input"
            value="${escapeAttribute(level.creator || "")}"
        >

        <label class="form-label">
            Points
        </label>

        <input
            id="editPoints"
            class="form-input"
            type="number"
            step="0.01"
            value="${escapeAttribute(level.points)}"
        >

        <label class="form-label">
            Video URL
        </label>

        <input
            id="editVideo"
            class="form-input"
            value="${escapeAttribute(level.videoUrl || "")}"
        >

        <div class="modal-footer">

            <button
                class="secondary-btn"
                onclick="closeModal()"
            >
                Cancel
            </button>

            <button
                class="primary-btn"
                onclick="saveLevelEdit('${escapeAttribute(id)}')"
            >
                Save
            </button>

        </div>
    `);
}


function saveLevelEdit(id) {

    const list =
        getSelectedList();

    const level =
        list.levels.find(
            x => x.id === id
        );

    if (!level) return;

    const name =
        document.getElementById("editName")
            .value.trim();

    const creator =
        document.getElementById("editCreator")
            .value.trim();

    const points =
        Number(
            document.getElementById("editPoints")
                .value
        );

    const videoUrl =
        document.getElementById("editVideo")
            .value.trim();

    if (!name) {

        alert("Level name cannot be empty.");

        return;
    }

    if (!Number.isFinite(points)) {

        alert("Enter a valid number of points.");

        return;
    }

    level.name = name;
    level.creator = creator;
    level.points = points;
    level.videoUrl = videoUrl;

    const videoThumbnail =
        getYouTubeThumbnail(videoUrl);

    if (videoThumbnail) {
        level.thumbnail =
            videoThumbnail;
    }

    list.updatedAt =
        Date.now();

    saveState();

    closeModal();

    render();
}


/* =========================================================
   ADD LEVEL MODAL
========================================================= */

function openAddLevel() {

    openModal(`

        <button
            class="modal-close"
            onclick="closeModal()"
        >×</button>

        <h2>Search Geometry Dash Levels</h2>

        <p style="color:#7f8898">
            Search real levels using Pointercrate
            and AREDL.
        </p>

        <div class="search-box">

            <input
                id="levelSearch"
                class="form-input"
                placeholder="Search level name..."
                onkeydown="if(event.key==='Enter') searchLevels()"
            >

            <button
                class="primary-btn"
                onclick="searchLevels()"
            >
                Search
            </button>

        </div>

        <div id="searchStatus"></div>

        <div id="searchResults" class="search-results"></div>

    `);

    setTimeout(() => {

        document
            .getElementById("levelSearch")
            ?.focus();

    }, 50);
}


/* =========================================================
   LEVEL API SEARCH
========================================================= */

async function searchLevels() {

    const input =
        document.getElementById("levelSearch");

    const results =
        document.getElementById("searchResults");

    const status =
        document.getElementById("searchStatus");

    if (!input || !results) return;

    const query =
        input.value.trim();

    if (!query) {

        status.innerHTML =
            `<div class="error">
                Enter a level name.
            </div>`;

        return;
    }

    results.innerHTML =
        `<div class="loading">
            Searching Pointercrate and AREDL...
        </div>`;

    status.innerHTML = "";

    const resultsMap =
        new Map();

    /* POINTERCRATE */

    try {

        const pointerResponse =
            await fetch(
                "https://pointercrate.com/api/v2/demons/"
            );

        if (pointerResponse.ok) {

            const pointerData =
                await pointerResponse.json();

            const demons =
                Array.isArray(pointerData)
                    ? pointerData
                    : pointerData.data || [];

            demons
                .filter(level =>
                    String(
                        level.name || ""
                    )
                    .toLowerCase()
                    .includes(query.toLowerCase())
                )
                .forEach(level => {

                    const id =
                        String(
                            level.id ||
                            level.level_id ||
                            level.name
                        );

                    resultsMap.set(
                        "pointercrate-" + id,
                        {
                            id:
                                "pointercrate-" + id,

                            gdId:
                                level.id || "",

                            name:
                                level.name ||
                                "Unknown Level",

                            creator:
                                level.position?.creator?.name ||
                                level.creator?.name ||
                                level.creator ||
                                "Unknown",

                            points:
                                0,

                            source:
                                "Pointercrate",

                            thumbnail:
                                getYouTubeThumbnail(
                                    level.video ||
                                    level.video_url ||
                                    ""
                                ),

                            videoUrl:
                                level.video ||
                                level.video_url ||
                                ""
                        }
                    );
                });
        }

    } catch (error) {

        console.warn(
            "Pointercrate search failed:",
            error
        );
    }


    /* AREDL */

    try {

        const aredlResponse =
            await fetch(
                "https://api.aredl.net/v2/api/aredl/levels"
            );

        if (aredlResponse.ok) {

            const aredlData =
                await aredlResponse.json();

            const levels =
                Array.isArray(aredlData)
                    ? aredlData
                    : aredlData.data ||
                      aredlData.levels ||
                      [];

            levels
                .filter(level =>
                    String(
                        level.name || ""
                    )
                    .toLowerCase()
                    .includes(query.toLowerCase())
                )
                .forEach(level => {

                    const id =
                        String(
                            level.id ||
                            level.level_id ||
                            level.name
                        );

                    const key =
                        "aredl-" + id;

                    if (
                        !resultsMap.has(key)
                    ) {

                        resultsMap.set(
                            key,
                            {
                                id: key,

                                gdId:
                                    level.id || "",

                                name:
                                    level.name ||
                                    "Unknown Level",

                                creator:
                                    level.creator ||
                                    level.author ||
                                    "Unknown",

                                points:
                                    0,

                                source:
                                    "AREDL",

                                thumbnail:
                                    getYouTubeThumbnail(
                                        level.video ||
                                        level.video_url ||
                                        ""
                                    ),

                                videoUrl:
                                    level.video ||
                                    level.video_url ||
                                    ""
                            }
                        );
                    }
                });
        }

    } catch (error) {

        console.warn(
            "AREDL search failed:",
            error
        );
    }


    const resultsArray =
        Array.from(
            resultsMap.values()
        ).slice(0, 50);

    if (!resultsArray.length) {

        results.innerHTML = `

            <div class="empty">

                <strong>No levels found.</strong>

                Try another search.

            </div>
        `;

        return;
    }

    results.innerHTML = "";

    resultsArray.forEach(level => {

        const button =
            document.createElement("button");

        button.className =
            "search-result";

        button.onclick =
            () => selectSearchResult(level);

        const thumbnail =
            level.thumbnail ||
            createFallbackThumbnail();

        button.innerHTML = `

            <img
                class="result-thumb"
                src="${escapeAttribute(thumbnail)}"
                onerror="this.src='${createFallbackThumbnail()}'"
            >

            <div class="result-info">

                <div class="result-name">
                    ${escapeHtml(level.name)}
                </div>

                <div class="result-meta">
                    ${escapeHtml(level.creator)}
                    •
                    ${escapeHtml(level.source)}
                </div>

            </div>
        `;

        results.appendChild(button);
    });
}


/* =========================================================
   SELECT SEARCH RESULT
========================================================= */

function selectSearchResult(level) {

    openModal(`

        <button
            class="modal-close"
            onclick="closeModal()"
        >×</button>

        <h2>
            ${escapeHtml(level.name)}
        </h2>

        <p style="color:#7f8898">
            ${escapeHtml(level.creator)}
            •
            ${escapeHtml(level.source)}
        </p>

        <label class="form-label">
            Points
        </label>

        <input

        <label class="form-label">

        </label>

        <input

        </p>

        <div class="modal-footer">

/* =========================================================
   ADD SELECTED LEVEL
========================================================= */

function addSelectedLevel(level) {

    const list =
        getSelectedList();

    if (!list) return;

    const points =
        Number(
            document.getElementById("newLevelPoints")
                .value
        );

    const videoUrl =
        document.getElementById("newLevelVideo")
            .value.trim();

    if (!Number.isFinite(points)) {

        alert("Enter a valid points value.");

        return;
    }

    const duplicate =
        list.levels.some(
            existing =>
                (
                    existing.source === level.source &&
                    existing.gdId &&
                    level.gdId &&
                    String(existing.gdId) ===
                    String(level.gdId)
                ) ||
                (
                    existing.name.toLowerCase() ===
                    level.name.toLowerCase()
                )
        );

    if (duplicate) {

        alert(
            "This level is already in this Demonlist."
        );

        return;
    }

    const thumbnail =
        getYouTubeThumbnail(videoUrl) ||
        level.thumbnail ||
        "";

    list.levels.push({

        id:
            crypto.randomUUID
                ? crypto.randomUUID()
                : Date.now().toString(),

        gdId:
            level.gdId || "",

        name:
            level.name,

        creator:
            level.creator || "Unknown",

        points:
            points,

        source:
            level.source,

        videoUrl:
            videoUrl,

        thumbnail:
            thumbnail,

        addedAt:
            Date.now()
    });

    list.updatedAt =
        Date.now();

    saveState();

    closeModal();

    render();
}


/* =========================================================
   YOUTUBE THUMBNAILS
========================================================= */

function getYouTubeThumbnail(url) {

    if (!url) return "";

    try {

        const parsed =
            new URL(url);

        let videoId = "";

        if (
            parsed.hostname.includes(
                "youtube.com"
            )
        ) {

            videoId =
                parsed.searchParams.get("v") || "";

        }

        if (
            parsed.hostname === "youtu.be"
        ) {

            videoId =
                parsed.pathname
                    .replace("/", "");
        }

        if (
            parsed.pathname.includes(
                "/shorts/"
            )
        ) {

            videoId =
                parsed.pathname
                    .split("/shorts/")[1]
                    .split("/")[0];
        }

        if (
            parsed.pathname.includes(
                "/embed/"
            )
        ) {

            videoId =
                parsed.pathname
                    .split("/embed/")[1]
                    .split("/")[0];
        }

        if (!videoId) return "";

        return (
            "https://img.youtube.com/vi/" +
            videoId +
            "/hqdefault.jpg"
        );

    } catch {

        return "";
    }
}


function createFallbackThumbnail() {

    return (
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="300"
                height="180"
                viewBox="0 0 300 180"
            >
                <rect
                    width="300"
                    height="180"
                    fill="#202630"
                />

                <text
                    x="150"
                    y="95"
                    text-anchor="middle"
                    fill="#7d8798"
                    font-size="18"
                    font-family="Arial"
                >
                    GD LEVEL
                </text>
            </svg>
        `)
    );
}


/* =========================================================
   MODAL
========================================================= */

function openModal(html) {

    document
        .getElementById("modal")
        .innerHTML = html;

    document
        .getElementById("modalBackdrop")
        .classList.remove("hidden");
}


function closeModal() {

    document
        .getElementById("modalBackdrop")
        .classList.add("hidden");

    document
        .getElementById("modal")
        .innerHTML = "";
}


function closeModalOutside(event) {

    if (
        event.target ===
        document.getElementById("modalBackdrop")
    ) {

        closeModal();
    }
}


/* =========================================================
   SECURITY / TEXT HELPERS
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

    return escapeHtml(value);
}
