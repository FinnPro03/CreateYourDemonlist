<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CreateYourDemonlist</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #090b10;
    color: #f4f6fb;
    font-family: Arial, Helvetica, sans-serif;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* =========================================================
   HEADER
========================================================= */

header {
    height: 68px;
    background: #11151d;
    border-bottom: 1px solid #252b36;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 24px;

    position: sticky;
    top: 0;

    z-index: 100;
}

.logo {
    font-size: 21px;
    font-weight: 900;
}

.logo span {
    color: #ff334d;
}

.header-buttons {
    display: flex;
    gap: 8px;
}

.header-btn {
    background: #1a202b;
    border: 1px solid #2d3543;
    color: white;

    padding: 9px 13px;
    border-radius: 9px;
}

.header-btn:hover {
    background: #242b37;
}

/* =========================================================
   SETUP
========================================================= */

.setup-screen {
    min-height: calc(100vh - 68px);

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px;
}

.setup-card {
    width: min(500px, 100%);

    background: #11151d;
    border: 1px solid #292f3b;

    border-radius: 18px;

    padding: 35px;

    text-align: center;

    box-shadow: 0 25px 80px rgba(0,0,0,.4);
}

.setup-icon {
    width: 76px;
    height: 76px;

    margin: 0 auto 20px;

    border-radius: 50%;

    background: #ff334d;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 34px;
    font-weight: 900;
}

.setup-card h1 {
    margin-bottom: 10px;
}

.setup-card p {
    color: #8e97a7;
    line-height: 1.5;
}

.username-input {
    width: 100%;

    background: #0b0e14;
    border: 1px solid #303746;

    color: white;

    padding: 14px;

    border-radius: 10px;

    outline: none;

    margin-top: 18px;
}

.username-input:focus {
    border-color: #ff334d;
}

/* =========================================================
   BUTTONS
========================================================= */

.primary-btn {
    background: #ff334d;
    border: none;

    color: white;

    padding: 11px 16px;

    border-radius: 9px;

    font-weight: 800;
}

.primary-btn:hover {
    background: #ff4d63;
}

.secondary-btn {
    background: #171d27;

    border: 1px solid #303847;

    color: white;

    padding: 10px 14px;

    border-radius: 9px;
}

.secondary-btn:hover {
    background: #222936;
}

.danger-btn {
    background: #28151a;

    border: 1px solid #5b2631;

    color: #ff8b99;

    padding: 10px 14px;

    border-radius: 9px;
}

.danger-btn:hover {
    background: #361a20;
}

/* =========================================================
   APP
========================================================= */

.app {
    min-height: calc(100vh - 68px);

    display: flex;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    width: 275px;

    flex-shrink: 0;

    background: #0f131a;

    border-right: 1px solid #252b36;

    padding: 20px;

    min-height: calc(100vh - 68px);
}

.profile-box {
    background: #171c25;

    border: 1px solid #292f3a;

    border-radius: 13px;

    padding: 14px;

    margin-bottom: 20px;
}

.profile-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.avatar {
    width: 44px;
    height: 44px;

    flex-shrink: 0;

    border-radius: 50%;

    background: #ff334d;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 18px;
    font-weight: 900;
}

.profile-name {
    font-weight: 900;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.profile-count {
    color: #818a9b;

    font-size: 12px;

    margin-top: 4px;
}

.sidebar-title {
    color: #7f8898;

    font-size: 12px;

    text-transform: uppercase;

    font-weight: 900;

    letter-spacing: .8px;

    margin: 20px 4px 8px;
}

.list-item {
    width: 100%;

    background: transparent;
    border: none;

    color: #d7dce5;

    padding: 11px;

    border-radius: 8px;

    text-align: left;

    display: flex;
    justify-content: space-between;

    gap: 8px;

    margin-bottom: 3px;
}

.list-item:hover {
    background: #191f29;
}

.list-item.active {
    background: #252c38;
    color: white;
}

.list-item-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.list-number {
    color: #707a8b;
    font-size: 12px;
}

.new-list-btn {
    width: 100%;

    background: #171d27;

    border: 1px dashed #394252;

    color: #bac1cc;

    padding: 11px;

    border-radius: 9px;

    margin-top: 8px;
}

.new-list-btn:hover {
    background: #202733;
}

/* =========================================================
   MAIN
========================================================= */

main {
    flex: 1;

    min-width: 0;

    padding: 30px;
}

.welcome {
    color: #8992a2;

    margin-bottom: 25px;
}

.list-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 15px;

    margin-bottom: 20px;
}

.list-title {
    margin: 0;

    font-size: 30px;

    word-break: break-word;
}

.list-actions {
    display: flex;

    gap: 8px;

    flex-shrink: 0;
}

/* =========================================================
   EMPTY
========================================================= */

.empty {
    border: 1px dashed #343c4a;

    border-radius: 14px;

    padding: 55px 20px;

    text-align: center;

    color: #808999;
}

.empty strong {
    display: block;

    color: #cbd0da;

    font-size: 18px;

    margin-bottom: 8px;
}

/* =========================================================
   LEVEL LIST
========================================================= */

.level-list {
    display: flex;

    flex-direction: column;

    gap: 9px;
}

.level-row {
    min-height: 90px;

    background: #11161e;

    border: 1px solid #252c38;

    border-radius: 12px;

    display: grid;

    grid-template-columns:
        55px
        90px
        minmax(0, 1fr)
        180px
        100px;

    align-items: center;

    gap: 14px;

    padding: 10px 14px;

    transition: .15s;
}

.level-row:hover {
    border-color: #394354;

    transform: translateY(-1px);
}

.rank {
    text-align: center;

    font-size: 22px;

    font-weight: 900;

    color: #929aaa;
}

.level-thumb {
    width: 90px;
    height: 58px;

    object-fit: cover;

    border-radius: 7px;

    background: #202630;
}

.level-name {
    font-weight: 900;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.level-creator {
    color: #8a94a5;

    font-size: 12px;

    margin-top: 5px;
}

.verification {
    min-width: 0;
}

.verifier {
    font-size: 13px;

    font-weight: 700;

    color: #d3d8e1;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

.verified-time {
    color: #737d8e;

    font-size: 11px;

    margin-top: 5px;
}

.source {
    text-align: center;

    color: #737d8e;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: .5px;
}

.level-actions {
    display: flex;

    justify-content: flex-end;

    gap: 5px;
}

.small-btn {
    background: #1b212b;

    border: 1px solid #303847;

    color: white;

    border-radius: 7px;

    padding: 7px 9px;

    font-size: 12px;
}

.small-btn:hover {
    background: #272f3b;
}

/* =========================================================
   SEARCH
========================================================= */

.search-box {
    display: flex;

    gap: 8px;
}

.search-box input {
    flex: 1;
}

.search-results {
    display: flex;

    flex-direction: column;

    gap: 7px;

    margin-top: 15px;
}

.search-result {
    width: 100%;

    background: #171d26;

    border: 1px solid #29313e;

    border-radius: 10px;

    padding: 11px;

    color: white;

    display: flex;

    align-items: center;

    gap: 12px;

    text-align: left;
}

.search-result:hover {
    background: #202733;

    border-color: #404a5b;
}

.result-thumb {
    width: 70px;
    height: 45px;

    object-fit: cover;

    border-radius: 6px;

    background: #242b36;

    flex-shrink: 0;
}

.result-info {
    min-width: 0;
}

.result-name {
    font-weight: 900;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

.result-meta {
    color: #7e8797;

    font-size: 12px;

    margin-top: 4px;
}

.loading {
    color: #929aaa;

    padding: 15px 0;
}

.error {
    color: #ff7787;

    background: #28151a;

    border: 1px solid #54232d;

    padding: 12px;

    border-radius: 9px;

    margin-top: 12px;
}

/* =========================================================
   MODAL
========================================================= */

.modal-backdrop {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.74);

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

    z-index: 500;
}

.modal {
    width: min(700px, 100%);

    max-height: 90vh;

    overflow-y: auto;

    background: #11161e;

    border: 1px solid #2b333f;

    border-radius: 16px;

    padding: 24px;

    box-shadow: 0 30px 100px rgba(0,0,0,.55);
}

.modal h2 {
    margin-top: 0;
}

.modal-close {
    float: right;

    background: transparent;

    border: none;

    color: #8d96a6;

    font-size: 23px;
}

.form-label {
    display: block;

    color: #aeb5c1;

    font-size: 13px;

    font-weight: 700;

    margin: 14px 0 6px;
}

.form-input {
    width: 100%;

    background: #0b0f15;

    border: 1px solid #303846;

    border-radius: 9px;

    color: white;

    padding: 12px;

    outline: none;
}

.form-input:focus {
    border-color: #ff334d;
}

.modal-footer {
    display: flex;

    justify-content: flex-end;

    gap: 8px;

    margin-top: 20px;
}

/* =========================================================
   PROFILE
========================================================= */

.big-profile {
    text-align: center;

    padding: 15px;
}

.big-avatar {
    width: 90px;
    height: 90px;

    border-radius: 50%;

    margin: 0 auto 15px;

    background: #ff334d;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 35px;

    font-weight: 900;
}

.stats {
    display: flex;

    justify-content: center;

    gap: 35px;

    margin-top: 20px;
}

.stat-number {
    font-size: 25px;

    font-weight: 900;
}

.stat-label {
    color: #7e8797;

    font-size: 12px;

    margin-top: 3px;
}

/* =========================================================
   SETTINGS
========================================================= */

.settings-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-top: 20px;
}

.settings-grid button {
    width: 100%;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 1000px) {

    .level-row {
        grid-template-columns:
            45px
            70px
            minmax(0,1fr)
            150px;
    }

    .level-thumb {
        width: 70px;
        height: 50px;
    }

    .source {
        display: none;
    }
}

@media(max-width: 700px) {

    header {
        padding: 0 12px;
    }

    .logo {
        font-size: 17px;
    }

    .app {
        display: block;
    }

    .sidebar {
        width: 100%;

        min-height: auto;

        border-right: none;

        border-bottom: 1px solid #252b36;

        padding: 12px;
    }

    main {
        padding: 18px 12px;
    }

    .list-item {
        display: inline-flex;

        width: auto;

        margin-right: 4px;
    }

    .new-list-btn {
        margin-bottom: 8px;
    }

    .list-header {
        flex-direction: column;

        align-items: flex-start;
    }

    .list-actions {
        width: 100%;

        flex-wrap: wrap;
    }

    .list-actions button {
        flex: 1;
    }

    .level-row {
        grid-template-columns:
            35px
            60px
            minmax(0,1fr);

        gap: 8px;

        padding: 8px;
    }

    .level-thumb {
        width: 60px;
        height: 43px;
    }

    .verification,
    .level-actions {
        display: none;
    }

    .header-btn {
        padding: 7px 9px;

        font-size: 12px;
    }

    .settings-grid {
        grid-template-columns: 1fr;
    }
}

</style>
</head>

<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">
        Create<span>Your</span>Demonlist
    </div>

    <div class="header-buttons">

        <button
            class="header-btn"
            onclick="openProfile()"
        >
            👤 Profile
        </button>

        <button
            class="header-btn"
            onclick="openSettings()"
        >
            ⚙️
        </button>

    </div>

</header>


<!-- =====================================================
     PROFILE SETUP
===================================================== -->

<section
    id="setupScreen"
    class="setup-screen"
>

    <div class="setup-card">

        <div class="setup-icon">
            D
        </div>

        <h1>
            CreateYourDemonlist
        </h1>

        <p>
            Create your local profile and start
            building your own Geometry Dash
            Demonlists.
        </p>

        <input
            id="usernameInput"
            class="username-input"
            maxlength="30"
            placeholder="Enter your username..."
        >

        <button
            class="primary-btn"
            style="width:100%;margin-top:12px;"
            onclick="createProfile()"
        >
            Continue
        </button>

    </div>

</section>


<!-- =====================================================
     APP
===================================================== -->

<div
    id="app"
    class="app hidden"
>

    <aside class="sidebar">

        <div class="profile-box">

            <div class="profile-row">

                <div
                    id="avatar"
                    class="avatar"
                >
                    ?
                </div>

                <div>

                    <div
                        id="profileName"
                        class="profile-name"
                    >
                        Username
                    </div>

                    <div
                        id="profileCount"
                        class="profile-count"
                    >
                        0 Demonlists
                    </div>

                </div>

            </div>

        </div>


        <div class="sidebar-title">
            Your Demonlists
        </div>


        <div id="listContainer"></div>


        <button
            class="new-list-btn"
            onclick="createList()"
        >
            + Create Demonlist
        </button>

    </aside>


    <main>

        <div
            id="welcomeText"
            class="welcome"
        ></div>

        <div id="listArea"></div>

    </main>

</div>


<!-- =====================================================
     MODAL
===================================================== -->

<div
    id="modalBackdrop"
    class="modal-backdrop hidden"
    onclick="closeModalOutside(event)"
>

    <div
        id="modal"
        class="modal"
    ></div>

</div>


<script>

/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
    "createYourDemonlist_v2";

let state =
    loadState();


function loadState() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!saved) {

            return {
                username: "",
                lists: [],
                selectedListId: null
            };
        }

        const data =
            JSON.parse(saved);

        return {

            username:
                data.username || "",

            lists:
                Array.isArray(data.lists)
                    ? data.lists
                    : [],

            selectedListId:
                data.selectedListId || null
        };

    } catch {

        return {
            username: "",
            lists: [],
            selectedListId: null
        };
    }
}


function saveState() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );
}


/* =========================================================
   ID
========================================================= */

function createId() {

    if (
        window.crypto &&
        crypto.randomUUID
    ) {

        return crypto.randomUUID();
    }

    return (
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .slice(2)
    );
}


/* =========================================================
   INITIALIZATION
========================================================= */

function initialize() {

    if (!state.username) {

        document
            .getElementById("setupScreen")
            .classList.remove("hidden");

        document
            .getElementById("app")
            .classList.add("hidden");

        return;
    }

    document
        .getElementById("setupScreen")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");


    if (
        !state.selectedListId ||
        !state.lists.some(
            list =>
                list.id ===
                state.selectedListId
        )
    ) {

        state.selectedListId =
            state.lists.length
                ? state.lists[0].id
                : null;

        saveState();
    }

    render();
}


initialize();


/* =========================================================
   PROFILE
========================================================= */

function createProfile() {

    const input =
        document.getElementById(
            "usernameInput"
        );

    const username =
        input.value.trim();

    if (!username) {

        alert(
            "Please enter a username."
        );

        return;
    }

    state.username =
        username.slice(0,30);

    saveState();

    initialize();
}


function changeUsername() {

    const result =
        prompt(
            "Enter your new username:",
            state.username
        );

    if (result === null)
        return;

    const username =
        result.trim();

    if (!username) {

        alert(
            "Username cannot be empty."
        );

        return;
    }

    state.username =
        username.slice(0,30);

    saveState();

    render();
}


function openProfile() {

    const totalLevels =
        state.lists.reduce(
            (total,list) =>
                total +
                list.levels.length,
            0
        );

    openModal(`

        <button
            class="modal-close"
            onclick="closeModal()"
        >
            ×
        </button>

        <div class="big-profile">

            <div class="big-avatar">

                ${escapeHtml(
                    state.username
                        .charAt(0)
                        .toUpperCase()
                )}

            </div>

            <h2>
                ${escapeHtml(
                    state.username
                )}
            </h2>

            <div class="stats">

                <div>

                    <div class="stat-number">
                        ${state.lists.length}
                    </div>

                    <div class="stat-label">
                        Demonlists
                    </div>

                </div>

                <div>

                    <div class="stat-number">
                        ${totalLevels}
                    </div>

                    <div class="stat-label">
                        Levels
                    </div>

                </div>

            </div>

        </div>

    `);
}


/* =========================================================
   LISTS
========================================================= */

function createList() {

    const result =
        prompt(
            "What should your Demonlist be called?"
        );

    if (result === null)
        return;

    const name =
        result.trim();

    if (!name) {

        alert(
            "The list needs a name."
        );

        return;
    }

    const list = {

        id:
            createId(),

        name:
            name.slice(0,100),

        levels: [],

        createdAt:
            Date.now(),

        updatedAt:
            Date.now()
    };

    state.lists.push(list);

    state.selectedListId =
        list.id;

    saveState();

    render();
}


function selectList(id) {

    state.selectedListId =
        id;

    saveState();

    render();
}


function getSelectedList() {

    return state.lists.find(
        list =>
            list.id ===
            state.selectedListId
    );
}


function renameList() {

    const list =
        getSelectedList();

    if (!list)
        return;

    const result =
        prompt(
            "New Demonlist name:",
            list.name
        );

    if (result === null)
        return;

    const name =
        result.trim();

    if (!name) {

        alert(
            "The list needs a name."
        );

        return;
    }

    list.name =
        name.slice(0,100);

    list.updatedAt =
        Date.now();

    saveState();

    render();
}


function deleteList() {

    const list =
        getSelectedList();

    if (!list)
        return;

    if (
        !confirm(
            `Delete "${list.name}"?\n\nThis will delete all levels in this list.`
        )
    ) {

        return;
    }

    state.lists =
        state.lists.filter(
            item =>
                item.id !==
                list.id
        );

    state.selectedListId =
        state.lists.length
            ? state.lists[0].id
            : null;

    saveState();

    render();
}


/* =========================================================
   RENDER
========================================================= */

function render() {

    document
        .getElementById(
            "profileName"
        )
        .textContent =
            state.username;

    document
        .getElementById(
            "profileCount"
        )
        .textContent =
            `${state.lists.length} ${
                state.lists.length === 1
                    ? "Demonlist"
                    : "Demonlists"
            }`;

    document
        .getElementById(
            "avatar"
        )
        .textContent =
            state.username
                .charAt(0)
                .toUpperCase();

    document
        .getElementById(
            "welcomeText"
        )
        .textContent =
            `Welcome, ${state.username}. Build your own rankings.`;

    renderSidebar();

    renderList();
}


function renderSidebar() {

    const container =
        document.getElementById(
            "listContainer"
        );

    container.innerHTML = "";

    state.lists.forEach(
        list => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "list-item" +
                (
                    list.id ===
                    state.selectedListId
                        ? " active"
                        : ""
                );

            button.onclick =
                () =>
                    selectList(
                        list.id
                    );

            button.innerHTML = `

                <span class="list-item-name">

                    ${escapeHtml(
                        list.name
                    )}

                </span>

                <span class="list-number">

                    ${list.levels.length}

                </span>

/* =========================================================
   MOVE LEVELS
========================================================= */

function moveLevelUp(id) {

    const list =
        getSelectedList();

    if (!list)
        return;

    const index =
        list.levels.findIndex(
            level =>
                level.id === id
        );

    if (
        index <= 0
    ) {
        return;
    }

    [
        list.levels[index - 1],
        list.levels[index]
    ] =
    [
        list.levels[index],
        list.levels[index - 1]
    ];

    list.updatedAt =
        Date.now();

    saveState();

    render();
}


function moveLevelDown(id) {

    const list =
        getSelectedList();

    if (!list)
        return;

    const index =
        list.levels.findIndex(
            level =>
                level.id === id
        );

    if (
        index < 0 ||
        index >= list.levels.length - 1
    ) {
        return;
    }

    [
        list.levels[index],
        list.levels[index + 1]
    ] =
    [
        list.levels[index + 1],
        list.levels[index]
    ];

    list.updatedAt =
        Date.now();

    saveState();

    render();
}

/* =========================================================
   SEARCH
========================================================= */

async function searchLevels() {

    const input =
        document.getElementById(
            "levelSearch"
        );

    const results =
        document.getElementById(
            "searchResults"
        );

    const status =
        document.getElementById(
            "searchStatus"
        );

    const query =
        input.value.trim();

    if (!query) {

        status.innerHTML =
            `<div class="error">
                Enter a level name.
            </div>`;

        return;
    }

    results.innerHTML =
        `<div class="loading">
            Searching Pointercrate and AREDL...
        </div>`;

    status.innerHTML = "";


    const resultsMap =
        new Map();


    /* POINTERCRATE */

    try {

        const response =
            await fetch(
                "https://pointercrate.com/api/v2/demons/"
            );

        if (response.ok) {

            const data =
                await response.json();

            const levels =
                Array.isArray(data)
                    ? data
                    : data.data || [];

            levels
                .filter(
                    level =>
                        String(
                            level.name || ""
                        )
                        .toLowerCase()
                        .includes(
                            query.toLowerCase()
                        )
                )
                .forEach(
                    level => {

                        const id =
                            String(
                                level.id ||
                                level.level_id ||
                                level.name
                            );

                        resultsMap.set(
                            "pointercrate-" + id,
                            {

                                id:
                                    "pointercrate-" +
                                    id,

                                gdId:
                                    level.id ||
                                    "",

                                name:
                                    level.name ||
                                    "Unknown Level",

                                creator:
                                    level.position
                                        ?.creator
                                        ?.name ||
                                    level.creator
                                        ?.name ||
                                    level.creator ||
                                    "Unknown",

                                source:
                                    "Pointercrate",

                                videoUrl:
                                    level.video ||
                                    level.video_url ||
                                    "",

                                thumbnail:
                                    getYouTubeThumbnail(
                                        level.video ||
                                        level.video_url ||
                                        ""
                                    )
                            }
                        );
                    }
                );
        }

    } catch(error) {

        console.warn(
            "Pointercrate failed",
            error
        );
    }


    /* AREDL */

    try {

        const response =
            await fetch(
                "https://api.aredl.net/v2/api/aredl/levels"
            );

        if (response.ok) {

            const data =
                await response.json();

            const levels =
                Array.isArray(data)
                    ? data
                    : data.data ||
                      data.levels ||
                      [];

            levels
                .filter(
                    level =>
                        String(
                            level.name || ""
                        )
                        .toLowerCase()
                        .includes(
                            query.toLowerCase()
                        )
                )
                .forEach(
                    level => {

                        const id =
                            String(
                                level.id ||
                                level.level_id ||
                                level.name
                            );

                        const key =
                            "aredl-" + id;

                        if (
                            !resultsMap.has(
                                key
                            )
                        ) {

                            resultsMap.set(
                                key,
                                {

                                    id: key,

                                    gdId:
                                        level.id ||
                                        "",

                                    name:
                                        level.name ||
                                        "Unknown Level",

                                    creator:
                                        level.creator ||
                                        level.author ||
                                        "Unknown",

                                    source:
                                        "AREDL",

                                    videoUrl:
                                        level.video ||
                                        level.video_url ||
                                        "",

                                    thumbnail:
                                        getYouTubeThumbnail(
                                            level.video ||
                                            level.video_url ||
                                            ""
                                        )
                                }
                            );
                        }
                    }
                );
        }

    } catch(error) {

        console.warn(
            "AREDL failed",
            error
        );
    }


    const found =
        Array.from(
            resultsMap.values()
        ).slice(0,50);


    if (!found.length) {

        results.innerHTML = `

            <div class="empty">

                <strong>
                    No levels found.
                </strong>

                Try another search.

            </div>
        `;

        return;
    }


    results.innerHTML = "";


    found.forEach(
        level => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "search-result";

            button.onclick =
                () =>
                    selectSearchResult(
                        level
                    );

            button.innerHTML = `

                <img
                    class="result-thumb"
                    src="${escapeAttribute(
                        level.thumbnail ||
                        createFallbackThumbnail()
                    )}"
                    onerror="this.src='${createFallbackThumbnail()}'"
                >

                <div class="result-info">

                    <div class="result-name">

                        ${escapeHtml(
                            level.name
                        )}

                    </div>

                    <div class="result-meta">

                        ${escapeHtml(
                            level.creator
                        )}

                        •

                        ${escapeHtml(
                            level.source
                        )}

                    </div>

                </div>

            `;

            results.appendChild(
                button
            );
        }
    );
}

function addSelectedLevel(level) {

    const list =
        getSelectedList();

    if (!list)
        return;


    const creator =
        document
            .getElementById(
                "newCreator"
            )
            .value
            .trim();


    const verifier =
        document
            .getElementById(
                "newVerifier"
            )
            .value
            .trim();


    const verifiedDate =
        document
            .getElementById(
                "newVerifiedDate"
            )
            .value;


    const videoUrl =
        document
            .getElementById(
                "newLevelVideo"
            )
            .value
            .trim();


    const duplicate =
        list.levels.some(
            existing =>

                (
                    existing.gdId &&
                    level.gdId &&
                    String(
                        existing.gdId
                    ) ===
                    String(
                        level.gdId
                    )
                )

                ||

                (
                    existing.name
                        .toLowerCase() ===
                    level.name
                        .toLowerCase()
                )
        );


    if (duplicate) {

        alert(
            "This level is already in this Demonlist."
        );

        return;
    }


    const thumbnail =
        getYouTubeThumbnail(
            videoUrl
        ) ||
        level.thumbnail ||
        "";


    list.levels.push({

        id:
            createId(),

        gdId:
            level.gdId || "",

        name:
            level.name,

        creator:
            creator ||
            level.creator ||
            "Unknown",

        verifier:
            verifier,

        verifiedDate:
            verifiedDate,

        source:
            level.source,

        videoUrl:
            videoUrl,

        thumbnail:
            thumbnail,

        addedAt:
            Date.now()
    });


    list.updatedAt =
        Date.now();


    saveState();

    closeModal();

    render();
}

/* =========================================================
   TIME AGO
========================================================= */

function timeAgo(dateString) {

    const date =
        new Date(
            dateString +
            "T00:00:00"
        );

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "Unknown date";
    }


    const now =
        new Date();


    const difference =
        now.getTime() -
        date.getTime();


    if (difference < 0) {

        return "in the future";
    }


    const seconds =
        Math.floor(
            difference /
            1000
        );


    const minutes =
        Math.floor(
            seconds /
            60
        );


    const hours =
        Math.floor(
            minutes /
            60
        );


    const days =
        Math.floor(
            hours /
            24
        );


    const months =
        Math.floor(
            days /
            30.4375
        );


    const years =
        Math.floor(
            days /
            365.25
        );


    if (years >= 1) {

        return years === 1
            ? "1 Year Ago"
            : `${years} Years Ago`;
    }


    if (months >= 1) {

        return months === 1
            ? "1 Month Ago"
            : `${months} Months Ago`;
    }


    if (days >= 1) {

        return days === 1
            ? "1 Day Ago"
            : `${days} Days Ago`;
    }


    if (hours >= 1) {

        return hours === 1
            ? "1 Hour Ago"
            : `${hours} Hours Ago`;
    }


    if (minutes >= 1) {

        return minutes === 1
            ? "1 Minute Ago"
            : `${minutes} Minutes Ago`;
    }


    return "Just Now";
}


/* =========================================================
   YOUTUBE
========================================================= */

function getYouTubeThumbnail(url) {

    if (!url)
        return "";


    try {

        const parsed =
            new URL(url);


        let videoId =
            "";


        if (
            parsed.hostname
                .includes(
                    "youtube.com"
                )
        ) {

            videoId =
                parsed.searchParams
                    .get("v") ||
                "";
        }


        if (
            parsed.hostname ===
            "youtu.be"
        ) {

            videoId =
                parsed.pathname
                    .replace(
                        "/",
                        ""
                    );
        }


        if (
            parsed.pathname
                .includes(
                    "/shorts/"
                )
        ) {

            videoId =
                parsed.pathname
                    .split(
                        "/shorts/"
                    )[1]
                    .split("/")[0];
        }


        if (
            parsed.pathname
                .includes(
                    "/embed/"
                )
        ) {

            videoId =
                parsed.pathname
                    .split(
                        "/embed/"
                    )[1]
                    .split("/")[0];
        }


        if (!videoId)
            return "";


        return (
            "https://img.youtube.com/vi/" +
            videoId +
            "/hqdefault.jpg"
        );

    } catch {

        return "";
    }
}

function exportData() {

    const data =
        JSON.stringify(
            state,
            null,
            2
        );


    const blob =
        new Blob(
            [data],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );

    link.href =
        url;

    link.download =
        "CreateYourDemonlist-Backup.json";


    document.body.appendChild(
        link
    );

    link.click();

    link.remove();


    URL.revokeObjectURL(
        url
    );
}

            document.createElement(
                "input"
            );

        newInput.type =
            "file";

        newInput.accept =
            ".json,application/json";

        newInput.onchange =
            importData;

        newInput.click();
    }
}


function importData(event) {

    const file =
        event.target.files?.[0];

    if (!file)
        return;


    const reader =
        new FileReader();


    reader.onload =
        () => {

            try {

                const imported =
                    JSON.parse(
                        reader.result
                    );


                if (
                    typeof imported !==
                    "object" ||
                    !Array.isArray(
                        imported.lists
                    )
                ) {

                    throw new Error(
                        "Invalid backup."
                    );
                }


                if (
                    !confirm(
                        "Import this backup? Your current local data will be replaced."
                    )
                ) {

                    return;
                }


                state = {

                    username:
                        imported.username ||
                        "",

                    lists:
                        imported.lists,

                    selectedListId:
                        imported.selectedListId ||
                        (
                            imported.lists[0]
                                ?.id ||
                            null
                        )
                };


                saveState();

                closeModal();

                initialize();

                alert(
                    "Backup imported successfully!"
                );

            } catch {

                alert(
                    "That file is not a valid CreateYourDemonlist backup."
                );
            }
        };


    reader.readAsText(
        file
    );
}


/* =========================================================
   RESET
========================================================= */

function resetEverything() {

    if (
        !confirm(
            "RESET EVERYTHING?\n\nThis will delete your profile and every Demonlist stored in this browser."
        )
    ) {

        return;
    }


    localStorage.removeItem(
        STORAGE_KEY
    );


    state = {

        username: "",

        lists: [],

        selectedListId: null
    };


    closeModal();

    initialize();
}


/* =========================================================
   MODALS
========================================================= */

function openModal(html) {

    document
        .getElementById(
            "modal"
        )
        .innerHTML =
            html;

    document
        .getElementById(
            "modalBackdrop"
        )
        .classList.remove(
            "hidden"
        );
}


function closeModal() {

    document
        .getElementById(
            "modalBackdrop"
        )
        .classList.add(
            "hidden"
        );

    document
        .getElementById(
            "modal"
        )
        .innerHTML = "";
}


function closeModalOutside(event) {

    if (
        event.target ===
        document.getElementById(
            "modalBackdrop"
        )
    ) {

        closeModal();
    }
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}


function escapeAttribute(value) {

    return escapeHtml(
        value
    );
}
